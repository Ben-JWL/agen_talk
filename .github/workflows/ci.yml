name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # manual run: also builds the PyInstaller app and runs the frozen selftest (job "frozen")

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: selftest (${{ matrix.os }}, py${{ matrix.py }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 is the floor (the collector runs on old servers); setup-python only offers it on the older Ubuntu image.
          # It stays stdlib-only: the OpenSSH fallback half of the selftest.
          - { os: ubuntu-22.04, py: "3.8" }
          - { os: ubuntu-latest, py: "3.12" }
          - { os: windows-latest, py: "3.12" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.py }}
      - name: Compile
        run: python -m py_compile agen_talk.py app.py ui/build.py tools/scan.py tools/check_ui.py packaging/make_icon.py
      - name: Install paramiko (in-app SSH half of the selftest)
        if: matrix.py == '3.12'
        run: python -m pip install paramiko==5.0.0
      - name: agen_talk selftest
        run: python agen_talk.py --selftest
      - name: app selftest (pywebview absent is fine)
        if: matrix.py == '3.12'
        run: python app.py --selftest

  ui:
    name: UI build matches index.html + hygiene scan + UI selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python tools/check_ui.py
      - run: python tools/scan.py
      - name: Sprites match their sources (pixel-exact v2 decode, fresh build, size budget)
        run: python art/sprites/check_v2.py
      - name: Sprite motion rules
        run: python art/sprites/validate_motion.py
      - name: UI selftest (dev build, headless Chrome)
        # ui/src/89-selftest.dev.js logs "SELFTEST ok" or "SELFTEST FAIL <why>" to the console; talkfx replaces the hub with a fake one.
        # The page title is overwritten by the next render, so the console log (Chrome's stderr) is what counts.
        run: |
          python ui/build.py --dev
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          [ -n "$chrome" ] || { echo "no Chrome on this runner"; exit 1; }
          rc=0
          timeout 120 "$chrome" --headless=new --disable-gpu --no-sandbox --no-first-run --user-data-dir="$RUNNER_TEMP/chrome-selftest" \
            --enable-logging=stderr --v=0 --virtual-time-budget=8000 \
            --dump-dom "file://$PWD/ui/dist/index.html?talkfx=1&selftest=1" > "$RUNNER_TEMP/dom.html" 2> "$RUNNER_TEMP/chrome.log" || rc=$?
          grep -a -E 'CONSOLE|SELFTEST' "$RUNNER_TEMP/chrome.log" | tail -n 40 || true
          [ "$rc" -eq 0 ] || { echo "Chrome exited with $rc"; exit 1; }
          if grep -a -q 'SELFTEST FAIL' "$RUNNER_TEMP/chrome.log"; then echo "UI selftest failed"; exit 1; fi
          grep -a -q 'SELFTEST ok' "$RUNNER_TEMP/chrome.log" || { echo "UI selftest did not report SELFTEST ok"; exit 1; }

  frozen:
    name: PyInstaller build + frozen selftest (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --require-hashes -r packaging/requirements-build.lock
      - name: Icon
        run: python packaging/make_icon.py
      - name: PyInstaller
        env:
          AT_VERSION: 0.0.0-ci.${{ github.run_number }}
        run: pyinstaller packaging/agen_talk.spec --noconfirm --distpath build/dist --workpath build/work
      - name: Smoke test built exe (selftest)
        shell: pwsh
        run: |
          $p = Start-Process "build\dist\AgenTalk\AgenTalk.exe" -ArgumentList "--selftest" -PassThru
          try {
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "selftest timed out" }
          } finally {
            Get-Content "$env:LOCALAPPDATA\AgenTalk\agen-talk.log" -Tail 40 -ErrorAction SilentlyContinue
          }
          if ($p.ExitCode -ne 0) { throw "selftest exit code $($p.ExitCode)" }
