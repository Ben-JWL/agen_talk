/* ---- 67-palette.js ---- */
/* ===== 67-palette.js — command palette (Ctrl+K only; / now focuses the list search), shortcut sheet (?), window.Keymap.
   Agent text reaches the DOM only through textContent (R.text / h()). ===== */
(() => {
  const { h, svgUse, text, attr, cls, $, keyed, M, S, go, ST } = R;
  const layer = $('#layer');
  let scrim = null, input, list, prev = null, mode = null, sel = '', rows = [];   // mode: 'pal' | 'sheet'
  let uid = 0;

  // ---------- keymap (P7 renders the same table) ----------
  const SHOW = { ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓' };
  const FIXED = [
    [['↑', '↓'], '목록에서 방 고르기'], [['Enter'], '방 열기'], [['Esc'], '닫기 (팔레트 → 검색 → 세션 정보 → 방)'],
    [['←', '→'], '하위 트리 접기 / 펼치기'], [['Shift+→'], '하위 트리 모두 펼치기'], [['Ctrl+K'], '명령 팔레트'],
  ];
  function table() {
    const out = []; let digits = false;
    for (const [k, v] of Object.entries(R.keys)) {
      if (k.startsWith('Arrow')) continue;     // covered by the fixed rows
      if (k === '1') { out.push({ keys: ['1'], label: '전체' }); continue; }
      if (/^[2-9]$/.test(k)) { if (!digits) out.push({ keys: ['2–9'], label: '채널 (순서대로)' }); digits = true; continue; }
      if (k === 'j') { out.push({ keys: ['j', 'k'], label: '다음 / 이전 방' }); continue; }
      if (k === 'k') continue;
      out.push({ keys: [SHOW[k] || k], label: v.label || k });
    }
    return out.concat(FIXED.map(([keys, label]) => ({ keys, label })));
  }
  const TALK_KEYS = [['Enter', '보내기 (한 번 더 눌러 확인)'], ['Shift+Enter', '줄바꿈'], ['Esc', '취소 (글은 남음)']];   // TALK-UX §5.4
  window.Keymap = { table };

  // ---------- fuzzy: subsequence, rewards consecutive runs and word starts; -1 = no match ----------
  function fuzzy(q, s) {
    s = s.toLowerCase(); let i = 0, score = 0, run = 0, last = -2;
    for (let j = 0; j < s.length && i < q.length; j++) if (s[j] === q[i]) {
      run = last === j - 1 ? run + 1 : 0; score += 1 + run * 2 + (j === 0 || /[\s\-_/.:]/.test(s[j - 1]) ? 3 : 0); last = j; i++;
    }
    return i < q.length ? -1 : score - s.length * 0.01;
  }
  const best = (q, fields) => { let b = -1; fields.forEach(([s, w]) => { if (!s) return; const f = fuzzy(q, s); if (f >= 0) b = Math.max(b, f * w); }); return b; };

  // ---------- items ----------
  const THEMES = ['system', 'light', 'dark'], THEME_KO = { system: '시스템', light: '라이트', dark: '다크' };
  function navItems() {
    const out = [{ key: 'go:chat', t: '채팅', ic: 'i-chat', cap: 'Esc', run: () => R.openChannel('all') }, { key: 'go:ch:all', t: '전체 채널', ic: 'i-all', cap: '1', run: () => R.openChannel('all') }];
    M.channels.forEach((c, i) => out.push({ key: 'go:ch:' + c.id, t: c.name, ic: C.chIcon(c), cap: i < 8 ? String(i + 2) : '', run: () => R.openChannel(c.id) }));
    return out.concat([['board', '보드', 'i-board', 'b'], ['settings', '설정', 'i-gear', ',']].map(([id, t, ic, cap]) => ({ key: 'go:' + id, t, ic, cap, run: () => go(id) })));
  }
  const actItems = () => [
    { key: 'act:refresh', t: '새로고침', ic: 'i-down', cap: 'r', run: () => { R.refresh(); R.emit('resort'); } },
    { key: 'act:pause', t: R.isPaused() ? '재개' : '일시정지', ic: R.isPaused() ? 'i-play' : 'i-pause', cap: 'p', run: () => R.setPaused(!R.isPaused()) },
    { key: 'act:theme', t: '테마 전환', s: '현재 ' + THEME_KO[S.theme], ic: 'i-gear', run: () => { S.theme = THEMES[(THEMES.indexOf(S.theme) + 1) % 3]; R.applySettings(); } },
    { key: 'act:kids', t: '하위 에이전트 보기', s: R.U.showKids ? '현재 켜짐' : '현재 꺼짐', ic: 'i-chev', run: () => { R.U.showKids = !R.U.showKids; R.save(); R.emit('resort'); } },
    { key: 'act:addsrv', t: '서버 추가', ic: 'i-server', run: () => AddServer.open({}) },
    ...(Room.canFlow() ? [{ key: 'act:flow', t: Room.flowOn ? '대화 보기' : '흐름 보기', s: '지시가 퍼지는 모양', ic: 'i-chev', cap: 'f', run: () => Room.toggleFlow() }] : []),
  ];
  function agentItems(q) {
    const out = [];
    for (const a of M.agents.values()) {
      const md = C.meta(a), chn = R.chName(a.ch);
      const sc = best(q, [[a.name, 3], [a.tool, 2], [md.model, 1.5], [chn, 2], [a.why, 1], [a.now, 1]]);
      if (sc >= 0) out.push({ key: 'a:' + a.key, sc, a, t: a.name, s: [chn, a.tool].filter(Boolean).join(' · '), kind: a.parent ? '하위' : '방' });
    }
    return out.sort((x, y) => y.sc - x.sc).slice(0, 8);
  }
  function build(raw) {
    const q = raw.toLowerCase().replace(/\s+/g, '');
    let g = [['이동', navItems()], ['동작', actItems()]];
    if (q) {
      g = g.map(([n, it]) => [n, it.map(x => { const sc = best(q, [[x.t, 1], [x.cap, 0.5]]); return { ...x, sc: sc >= 0 && x.t.toLowerCase().replace(/\s+/g, '').startsWith(q) ? sc + 100 : sc }; }).filter(x => x.sc >= 0).sort((a, b) => b.sc - a.sc)]);
      g.push(['방', agentItems(q)]);
      g = g.filter(x => x[1].length).sort((a, b) => b[1][0].sc - a[1][0].sc);     // best-matching group first
    }
    const flat = [];
    for (const [n, it] of g) { flat.push({ key: 'h:' + n, head: n }); for (const x of it) flat.push(x); }
    return flat;
  }

  // ---------- rendering ----------
  function mkRow(it) {
    const kind = it.key.split(':')[0];
    if (kind === 'h') return h('div.pal-h', { role: 'presentation' });
    const r = h('div.pal-r', { class: kind, role: 'option', id: 'pal-o' + (++uid), on: { click: () => run(it.key), mousemove: () => setSel(it.key, false) } },
      kind === 'a' ? C.glyph(it.a.st) : svgUse(it.ic, 'ic'), h('span.m', h('span.t'), h('span.s')), h('span.e'));
    return r;
  }
  function setRow(el, it) {
    if (it.head) return text(el, it.head);
    text(el.querySelector('.t'), it.t); if (it.ic && !it.a) attr(el.querySelector('use'), 'href', '#' + it.ic); attr(el.querySelector('.t'), 'title', it.t);
    text(el.querySelector('.s'), it.s || '');
    const e = el.querySelector('.e');
    if (it.a) { C.setGlyph(el.firstElementChild, it.a.st); text(e, it.kind); }
    else if (it.cap && !e.firstChild) e.append(C.kbd(it.cap));
    else if (it.cap) text(e.firstChild, it.cap);
    else text(e, '');
  }
  function render(scroll) {
    rows = build(input.value);
    const opts = rows.filter(r => !r.head);
    if (!opts.length) rows = [{ key: 'none', none: true }];
    keyed(list, rows, {
      key: r => r.key,
      create: r => r.none ? h('div.pal-none', '일치하는 항목이 없습니다') : mkRow(r),
      update: (el, r) => { if (!r.none) setRow(el, r); },
    });
    if (!opts.some(r => r.key === sel)) sel = opts[0] ? opts[0].key : '';
    paint(scroll);
  }
  function paint(scroll) {
    let act = null;
    for (const el of list.children) { const on = el.dataset.key === sel; if (el.getAttribute('role') === 'option') attr(el, 'aria-selected', on ? 'true' : 'false'); if (on) act = el; }
    attr(input, 'aria-activedescendant', act && act.id);
    if (scroll && act) { act.scrollIntoView({ block: 'nearest' }); if (act.previousElementSibling && !act.previousElementSibling.previousElementSibling) list.scrollTop = 0; }
  }
  function setSel(k, scroll) { if (sel === k) return; sel = k; paint(scroll); }
  function move(d) {
    const opts = rows.filter(r => !r.head && !r.none); if (!opts.length) return;
    const i = opts.findIndex(r => r.key === sel);
    setSel(opts[(i + d + opts.length) % opts.length].key, true);
  }
  function run(k, shift) {
    const it = rows.find(r => r.key === k); if (!it) return;
    close();
    if (it.a) R.openRoom(it.a.ch, it.a.id); else it.run();
  }

  // ---------- open / close ----------
  function open(m, q) {
    if (scrim) close();
    prev = document.activeElement; mode = m;
    scrim = h('div.pal-scrim', { class: m === 'sheet' ? 'sheet' : '', on: { mousedown: e => { if (e.target === scrim) close(); } } });
    scrim.addEventListener('wheel', e => { if (e.target === scrim) e.preventDefault(); }, { passive: false });
    if (m === 'pal') {
      input = h('input', { type: 'text', role: 'combobox', 'aria-label': '검색 또는 명령', placeholder: '검색 또는 명령…', autocomplete: 'off', spellcheck: 'false', 'aria-expanded': 'true', 'aria-controls': 'pal-list', 'aria-autocomplete': 'list' });
      list = h('div.pal-list#pal-list', { role: 'listbox', 'aria-label': '결과' });
      input.addEventListener('input', () => { sel = ''; render(true); });
      input.addEventListener('keydown', onKey);
      scrim.append(h('div.pal', { role: 'dialog', 'aria-modal': 'true', 'aria-label': '검색 또는 명령', on: { mousedown: e => { if (e.target !== input) e.preventDefault(); } } },   // focus never leaves the input
        h('div.pal-in', svgUse('i-search'), input), list,
        h('div.pal-foot', h('span', C.kbd('Esc'), '닫기'), h('span', '열기', C.kbd('↵')))));
      layer.append(scrim); input.value = q || ''; render(true); input.focus({ preventScroll: true });
    } else {
      const dlg = h('div.pal', { role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'sheet-t' },
        h('div.sheet-h', h('span#sheet-t', '단축키'), h('button.ibtn', { type: 'button', 'aria-label': '닫기', on: { click: close } }, C.kbd('Esc'))),
        h('div.sheet-b', { tabindex: '-1' }, table().map(r => h('div.sheet-r', h('span', r.label), h('span.k', r.keys.map(k => C.kbd(k))))),
          h('div.sheet-g', '톡'), TALK_KEYS.map(([k, l]) => h('div.sheet-r', h('span', l), h('span.k', C.kbd(k)))),
          h('div.sheet-leg', '■ 터미널에서 입력한 것 · □ 에겐 톡에서 보낸 메시지')));
      scrim.append(dlg); layer.append(scrim); dlg.querySelector('.sheet-b').focus({ preventScroll: true });   // the scroller holds focus so arrows/PageDown scroll
    }
    addEventListener('keydown', trap, true);
  }
  function close() {
    if (!scrim) return;
    removeEventListener('keydown', trap, true);
    scrim.remove(); scrim = null; mode = null;
    if (prev && prev.isConnected) prev.focus({ preventScroll: true }); prev = null;
  }
  // while a dialog is open: keep Tab inside, and let nothing but Esc / ? / Ctrl+K reach the page's global keys
  function trap(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      if (mode === 'sheet') { const b = scrim.querySelector('button'); (document.activeElement === b ? scrim.querySelector('.sheet-b') : b).focus({ preventScroll: true }); }
      return;
    }
    if (e.key === 'Escape') return;
    if (mode === 'sheet' && (e.key === '?' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'))) { e.preventDefault(); e.stopPropagation(); close(); if (e.key !== '?') open('pal'); return; }
    if (mode === 'sheet') { e.stopPropagation(); if (e.key.startsWith('Arrow') || e.key === ' ') return; }
  }
  function onKey(e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); if (sel) run(sel, e.shiftKey); }
  }

  R.onEsc(() => { if (!scrim) return false; close(); return true; });   // registered after P2 → runs first
  R.on('model', () => { if (mode === 'pal') render(false); });
  R.on('palette', () => (mode === 'pal' ? close() : open('pal')));
  R.key('?', () => (mode === 'sheet' ? close() : open('sheet')), '단축키');
  // screenshot / test overrides, like ?theme=: ?pal=data opens the palette with a query, ?sheet=1 the shortcut sheet
  let qs = new URLSearchParams(location.search);
  if (!qs.has('pal') && !qs.has('sheet')) qs = null;
  if (qs) R.on('model', () => { if (qs) { const q = qs; qs = null; open(q.has('sheet') ? 'sheet' : 'pal', q.get('pal')); } });
})();

/* ---- 68-states.js ---- */
/* ===== 68-states.js — window.States: skeleton / banner / missing (CHAT-UX §6). The hub-down line lives in the list's summary row.
   All elements are cached (banner per channel, empty per kind, missing per session) and patched in place; text via textContent only. ===== */
window.States = (() => {
  const { h, svgUse, text, attr, cls, M, on, $ } = R;
  const nodes = (n, f) => Array.from({ length: n }, f);

  // ---------- skeleton (views call this until M.loaded; the header ring is the only spinner) ----------
  function skeleton(n = 5) {
    return h('div.sk-list', { 'aria-hidden': 'true', class: M.loaded ? 'done' : '' },
      nodes(n, () => h('div.sk-row', h('i.g'), h('i.b1'), h('i.e'), h('i.b2'))));
  }
  on('model', () => R.$$('.sk-list:not(.done)').forEach(el => el.classList.add('done')));   // never shimmer after load

  // ---------- badperm: the PC-side Windows permission fix (constant command, copy button, one more line) ----------
  function badperm() {
    const b = R.BADPERM, btn = h('button.btn.sm', { type: 'button', on: { click: e => C.copy(b.cmd, e.currentTarget, '명령 복사') } }, '명령 복사');
    return h('div.bperm', h('code.mono.bcmd', b.cmd), h('div.bact', btn), h('p.meta', b.extra));
  }

  // ---------- banner(ch): one element per channel; null when ok and no warnings ----------
  const banners = {};
  function mkBanner(ch) {
    const log = h('pre.inset', { hidden: true, id: 'bnlog-' + ch });
    const logBtn = h('button.btn.link', { type: 'button', 'aria-expanded': 'false', 'aria-controls': 'bnlog-' + ch, on: { click: () => { log.hidden = !log.hidden; attr(logBtn, 'aria-expanded', log.hidden ? 'false' : 'true'); } } }, '로그 보기');
    const retry = () => { R.refresh(); again2.disabled = true; text(again2, '확인하는 중…'); setTimeout(() => { again2.disabled = false; text(again2, '지금 확인'); }, 2500); };
    const again2 = h('button.btn.primary', { type: 'button', on: { click: retry } }, '지금 확인');
    const fixBtn = h('button.btn.primary', { type: 'button', hidden: true, on: { click: () => AddServer.open({ ch }) } }, '이 서버에 키 등록하기');
    const tunnel = h('span.hint'), sep1 = h('span.sep', '·'), bp = badperm();
    const err = h('div.bn-err', { role: 'alert', hidden: true },
      h('div.ttl', svgUse('g-dead', 'gl'), h('span.t')), h('div.sub'),
      h('div.acts', tunnel, bp, sep1, logBtn, fixBtn, again2), log);
    const longer = h('span.meta', { hidden: true }, '오래 걸리면 허브 창의 로그와 channels.json의 주소를 확인하세요');
    const conn = h('div.bn-conn', { role: 'status', hidden: true }, h('span', '서버에 연결하는 중입니다…'), longer, h('div.indet', { 'aria-hidden': 'true' }));
    const el = h('div.st-banner', { data: { ch } }, conn, err);
    el._p = { err, conn, log, tunnel, bp, sep1, longer, fixBtn, again2 };
    return el;
  }
  function banner(ch) {
    const c = R.chan(ch);
    if (!c) return null;
    if (c.state === 'ok' && !c.stale) { if (banners[ch]) banners[ch].remove(); return null; }
    const el = banners[ch] || (banners[ch] = mkBanner(ch)), p = el._p;
    p.conn.hidden = c.state !== 'connecting';
    el._since = c.state === 'connecting' ? el._since || Date.now() : 0;
    p.longer.hidden = !el._since || Date.now() - el._since < 30000;
    const bad = c.state === 'error' || (c.state === 'ok' && c.stale);
    p.err.hidden = !bad;
    if (bad) {
      const ssh = c.kind === 'ssh' && c.state === 'error';
      const bpm = ssh && R.sshKind(c.error) === 'badperm'; p.bp.hidden = !bpm;
      text(p.err.querySelector('.t'), bpm ? R.BADPERM.title : c.state === 'ok' ? '수집이 중단되었습니다' : ssh ? 'SSH 연결이 끊겼습니다' : '연결 오류');
      text(p.err.querySelector('.sub'), (c.t ? '마지막 수집 ' + R.fmtHM(c.t) : '아직 받은 데이터가 없습니다') + ' · 허브가 자동으로 다시 연결합니다 (최대 1분 간격)');
      const fx = R.sshFix(c); p.fixBtn.hidden = !fx; cls(p.again2, 'primary', !fx); cls(p.again2, 'link', fx);
      p.tunnel.hidden = !ssh; p.sep1.hidden = true;   // the hint is long: it wraps, a leading dot would dangle
      if (ssh) text(p.tunnel, R.sshHint(c.error) + ' (' + R.sshErr(c.error) + ')');
      text(p.log, c.error || '허브가 오류 내용을 보내지 않았습니다');
      if (!ssh && c.state === 'error' && p.log.hidden && !p.log.dataset.seen) { p.log.hidden = false; p.log.dataset.seen = '1'; attr(p.err.querySelector('[aria-controls]'), 'aria-expanded', 'true'); }   // non-ssh: the error text is the content, show it once
    }
    return el;
  }

  // ---------- missing(ch, id): session info unavailable; P3 places the dimmed last tree under it ----------
  const missings = {};
  function missing(ch, id) {
    const k = ch + '\n' + id;
    if (!missings[k]) {
      missings[k] = h('div.missing', { role: 'alert' },
        h('h3', svgUse('i-flag'), '세션 정보를 가져오지 못했습니다'),
        h('ul', h('li', '채널 연결이 끊겼을 수 있습니다 — 채널 연결 상태를 확인하세요'), h('li', '세션이 이미 종료되어 목록에서 사라졌을 수 있습니다'), h('li', '이 세션을 읽을 권한이 없을 수 있습니다')),
        h('div.acts', h('button.btn.primary', { type: 'button', on: { click: () => R.refresh() } }, '다시 시도')));
    }
    return missings[k];
  }

  return { skeleton, banner, missing, badperm };
})();

/* ---- 69-addserver.js ---- */
/* ===== 69-addserver.js — 서버 추가 dialog (IN-APP-SSH-ENG §3/§5). window.AddServer.open({ch?, host?, port?, name?}).
   Host, port, account and password are typed here; the password goes only into the POST body, is cleared from the field right after submit
   and is never kept by the page. Hub strings go through textContent only. ===== */
window.AddServer = (() => {
  const { h, svgUse, text, attr, cls, M } = R;
  const TOKEN = (document.querySelector('meta[name=at-token]') || {}).content || '';
  const RE = { host: /^[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?$/, user: /^[A-Za-z_][A-Za-z0-9._-]{0,31}$/ };
  const STEPS = ['연결', '서버 확인', '키 등록', '접속 확인', '채널 등록'], GL = { pending: 'g-idle', active: 'g-work', user: 'g-user', done: 'g-done', error: 'g-dead' };
  const PH = { connecting: 0, confirm_hostkey: 1, installing_key: 2, verifying: 3 };

      if (r.status === 404) r.body = { state: 'error', kind: 'other', message: '허브가 다시 시작되어 작업을 찾을 수 없습니다 — 다시 시도하세요' };
      if (!(r.body && r.body.state)) throw new Error('bad poll');
      p.fails = 0;
      {
        p.j = r.body; p.running = !['done', 'error'].includes(r.body.state);
        if (r.body.state === 'confirm_hostkey') p.sawConfirm = true;
        if (r.body.state in PH) p.phase = r.body.state;
        paint(r.body);
      }
    } catch {
      if (job !== p) return;
      if (++p.fails >= 5) { p.running = false; p.j = { state: 'error', kind: 'hub_lost', phase: p.phase, message: '허브 응답 없음' }; paint(p.j); return; }   // stop retrying: the hub is gone; × / Esc work again
    }
    if (job === p && p.running) timer = setTimeout(poll, 1000);   // every second while open, whatever the pause state
  }

  const P = ['pending', ''];
  function steps(list) {
    list.forEach(([s, d], i) => { const li = E.steps.children[i], d_ = li.querySelector('.d'); attr(li, 'data-st', s); text(li.querySelector('b'), STEPS[i]); li.querySelector('use').setAttribute('href', '#' + GL[s]); cls(li.querySelector('svg'), 'pulse', s === 'active'); text(d_, d); li.hidden = i === 1 && !(job && job.sawConfirm); });
  }
  function paint(j) {
    if (!['connecting', 'confirm_hostkey', 'installing_key', 'verifying'].includes(j.state)) flash('');   // a finished job leaves no stale 'in progress' line
    const p = job, s = j.state, sub = p.rq.user + '@' + p.rq.host + ' · 포트 ' + p.rq.port;
    if (s === 'done') {
      const key = String(j.key || '').replace(/\.pub$/, ''), sess = j.auth === 'password-session';
      steps([['done', ''], ['done', '서버 지문 확인됨'], ['done', sess ? '건너뜀 (이 세션 동안만 비밀번호 사용)' : key ? '키 등록됨' : '키 등록됨'], ['done', sess ? '' : '키로 접속됨'], ['done', fix ? '채널을 고치고 다시 연결합니다' : '채널 목록에 추가하고 연결했습니다']]);
      const c = j.channel || {}, nm = String(c.name || p.rq.name || p.rq.host);
      R.U.lastUser = p.rq.user; R.save(); R.loadPresets();
      text(E.okTitle, '연결 완료'); text(E.okLine, sess ? nm + '에 이 세션 동안만 비밀번호로 연결합니다.' : nm + '에 키로 접속합니다. 비밀번호는 더 이상 필요 없습니다.');
      text(E.okNote, sess ? '에겐 톡을 닫으면 비밀번호가 사라지고, 다시 열면 비밀번호를 한 번 더 물어봅니다.' : (key ? '키: ' + key + ' (이 PC만) · ' : '') + "서버의 ~/.ssh/authorized_keys 에서 '" + String(j.comment || 'agen-talk@PC이름') + "' 줄을 지우면 접속이 끊깁니다. " + (fix ? '이 채널은 곧 다시 연결됩니다.' : "채널 칩에 '" + nm + "'가 생겼습니다."));
      E.open.onclick = () => { dlg.close(); R.openChannel(c.id || ''); };
      pane('done', sub); E.open.focus(); return;
    }
    pane('prog', sub);
    if (!dlg.contains(document.activeElement) || document.activeElement === dlg) E.prog.focus({ preventScroll: true });   // the focused button was hidden with the form
    if (s === 'error') return paintErr(j);
    E.band.hidden = true;
    const ask = s === 'confirm_hostkey';
    E.confirm.hidden = !ask; E.pacts.hidden = ask;
    if (ask) { text(E.fp, (j.keytype ? String(j.keytype) + ' · ' : '') + String(j.fingerprint || '')); E.fpYes.disabled = E.fpNo.disabled = false; if (!p.confirmShown) { p.confirmShown = true; E.confirmAt = Date.now(); E.fpYes.focus(); } }
    if (!/취소하는 중/.test(E.cancel.textContent)) { E.cancel.disabled = false; text(E.cancel, '취소'); }
    steps(s === 'confirm_hostkey' ? [['done', ''], ['user', '서버 지문을 확인하세요'], P, P, P]
      : s === 'installing_key' ? [['done', ''], ['done', '서버 지문 확인됨'], ['active', '이 PC 전용 키를 서버에 등록하는 중…'], P, P]
      : s === 'verifying' ? [['done', ''], ['done', '서버 지문 확인됨'], ['done', '키 등록됨'], ['active', '비밀번호 없이 접속되는지 확인하는 중…'], P]
      : [['active', '서버에 연결하는 중…'], P, P, P, P]);
  }
  function paintErr(j) {
    const p = job, k = ERR[j.kind] ? j.kind : 'other', [title, why, at, acts] = ERR[k], bad = Math.min(4, at(p, j) ?? 0), key = String(j.key || '');
    steps(STEPS.map((_, i) => i < bad ? ['done', ''] : i === bad ? ['error', ''] : P));
    const late = k === 'cancelled' && (PH[j.phase || p.phase] || 0) >= PH.installing_key;
    const cm = String(j.comment || 'agen-talk@PC이름');
    text(E.band.querySelector('.t'), k === 'wrong_password' && !p.rq.hadPw ? '비밀번호를 입력하세요' : title);
    text(E.band.querySelector('.why'), late ? "취소했지만 공개키는 이미 서버에 등록됐을 수 있습니다. 서버의 ~/.ssh/authorized_keys 에서 '" + cm + "' 줄을 지우면 접속이 끊깁니다." : j.kind === 'cancelled' && j.message ? j.message : why.replace("'agen-talk@PC이름'", "'" + cm + "'"));
    text(E.band.querySelector('.msg'), k === 'cancelled' || !j.message ? '' : R.sshErr(j.message));
    E.band.dataset.kind = k; E.band.hidden = false; E.confirm.hidden = true; E.pacts.hidden = true;
    const kh = E.band.querySelector('.kh'); kh.hidden = k !== 'host_key_changed' || !j.known_hosts; text(kh, kh.hidden ? '' : 'known_hosts: ' + String(j.known_hosts).slice(0, 200));
    text(E.log, R.str(j.log || j.message || '허브가 로그를 보내지 않았습니다', 4000)); E.log.hidden = k !== 'other'; attr(E.logBtn, 'aria-expanded', E.log.hidden ? 'false' : 'true');
    const fn = { retry: () => back('pw'), user: () => back('user'), host: () => back('host'), py: () => { E.pyrow.hidden = false; back('py'); }, session: () => { E.sessrow.hidden = false; E.sess.checked = true; back('pw'); }, close: () => tryClose(), forget };
    const mk = ([l, t, f]) => h('button' + (t === 'l' ? '.btn.link' : t === 'p' ? '.btn.primary' : '.btn'), { type: 'button', on: { click: fn[f] } }, l);
    E.acts.replaceChildren(...acts.filter(a => a[1] === 'l').map(mk), E.logBtn, ...acts.filter(a => a[1] !== 'l').map(mk));
    const pr = E.acts.querySelector('.primary'); if (pr) pr.focus();
  }
  // back to the form with the same address; the password field is empty again (it was cleared at submit)
  function back(k) { const rq = job.rq; E.host.value = rq.host; E.user.value = rq.user; E.port.value = rq.port; E.name.value = rq.name; E.pw.value = ''; job = null; pane('form'); paintPresets(); E[k].focus(); }
  async function forget() {
    const rq = job.rq; flash('');
    let r; try { r = await api('api/servers/forget-hostkey', { host: rq.host, port: rq.port }); } catch { r = { status: 0 }; }
    if (r.status === 200 && r.body && r.body.ok) back('pw'); else flash('기록을 지우지 못했습니다 — 에겐 톡을 다시 시작한 뒤 다시 시도하세요');
  }
  return { open };
})();

/* ===== 90-tail.html (lead) — boot ===== */
R.boot();
</script>
