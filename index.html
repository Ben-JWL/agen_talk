.sk-list:not(.done) .sk-row i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ink) 7%, transparent), transparent); transform: translateX(-100%); animation: sk-shimmer 1.6s ease-in-out infinite; }
@keyframes sk-shimmer { to { transform: translateX(100%); } }
.st-banner { display: flex; flex-direction: column; gap: 8px; }
.st-banner > [hidden] { display: none; }
.bn-err { position: relative; display: grid; gap: 4px; padding: 12px 12px 12px 16px; border-radius: var(--r-btn); background: var(--canvas); overflow: hidden; }
.bn-err::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--ink); }
.bn-err .ttl { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink); }
.bn-err .ttl .gl { color: var(--ink); flex: none; }
.bn-err .sub { color: var(--ink-2); font-size: 12.5px; line-height: 18px; }
/* every line wraps and every button fits the list pane at its narrowest (260 px): no nowrap label may push the card wider */
.bn-err, .bn-err > * { min-width: 0; overflow-wrap: anywhere; }
.bn-err .ttl > span { min-width: 0; }
.bn-err .hint { color: var(--ink-2); font-size: 12.5px; line-height: 18px; }
.bn-err .hint[hidden], .bn-err .hint .raw[hidden], .bn-err .acts > [hidden] { display: none; }
.bn-err .hint .more { display: inline; height: auto; padding: 0; font-size: 12px; line-height: 18px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; }
.bn-err .hint .raw { display: block; margin-top: 4px; padding: 6px 8px; border-radius: 6px; background: var(--surface); font-size: 11.5px; line-height: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bn-err .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 6px; color: var(--ink-2); min-width: 0; }
.bn-err .acts .btn { max-width: 100%; min-width: 0; white-space: normal; height: auto; min-height: 32px; padding-top: 4px; padding-bottom: 4px; line-height: 18px; text-align: center; }
.bn-err .acts .btn.link { min-height: 0; padding: 0; }
.bn-err .acts .sep { color: var(--ink-2); }
.bn-err .inset { margin: 6px 0 0; background: var(--surface); white-space: pre-wrap; overflow-wrap: anywhere; }
.bn-conn { display: grid; gap: 8px; padding: 12px 16px; border-radius: var(--r-btn); background: var(--canvas); color: var(--ink-2); }
.indet { position: relative; height: 2px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 10%, transparent); overflow: hidden; }
.indet::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 30%; border-radius: 2px; background: var(--ink); animation: indet 1.4s ease-in-out infinite; }
html[data-motion=reduce] .indet::after { animation: none; width: 100%; opacity: .4; }
@media (prefers-reduced-motion: reduce) { html:not([data-motion=full]) .indet::after { animation: none; width: 100%; opacity: .4; } }

/* badperm: PC-side Windows permission fix (ADD-SERVER-ENG §10) */
.bperm { display: grid; gap: 6px; flex-basis: 100%; min-width: 0; margin: 4px 0 2px; }
.bperm .bcmd { display: block; padding: 8px 10px; border-radius: var(--r-btn); background: var(--surface); font-size: 12px; line-height: 17px; white-space: pre-wrap; word-break: break-all; user-select: all; }
.bperm .bact { display: flex; justify-content: flex-start; }
.bperm p { margin: 0; }

/* ---- 39-addserver.css ---- */
/* ===== 39-addserver.css — 서버 추가 dialog skinned per CHAT-UX §8 (flow/copy unchanged). Tokens only. ===== */
.dlg { width: min(480px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 20px; border: 1px solid var(--line); border-radius: var(--r-dlg); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-float); overflow: auto; }
.dlg::backdrop { background: color-mix(in srgb, var(--ink) 40%, transparent); }
.dlg .hd { padding-right: 36px; }
.dlg .x { position: absolute; top: 14px; right: 14px; height: 32px; min-width: 32px; padding: 0; }
.dlg .acts.rev { flex-direction: row-reverse; justify-content: flex-start; }
.dlg > .meta { margin: 4px 0 14px; }
.dlg .frow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 8px; align-items: start; margin-bottom: 10px; }
.dlg .frow > label { line-height: 34px; font-weight: 500; }
.dlg .frow.pair { grid-template-columns: 96px 80px auto minmax(0, 1fr); }
.dlg .frow.pair > label + .fc + label { padding-left: 8px; }
.dlg .field input:invalid { box-shadow: none; }
.dlg .field input[aria-invalid=true] { color: var(--ink); }
.dlg .field:has(input[aria-invalid=true]) { outline: 2px solid var(--ink); }
.dlg .err { margin-top: 4px; color: var(--ink); font-weight: 600; font-size: 12.5px; line-height: 18px; }
.dlg .priv { display: flex; gap: 8px; align-items: flex-start; margin: 14px 0 0; }
.dlg .priv svg { width: 16px; height: 16px; flex: none; fill: currentColor; margin-top: 1px; }
.dlg .acts { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.dlg .bn-err .acts { justify-content: flex-start; gap: 8px 12px; margin-top: 6px; }
.dlg .bn-err .acts .link:first-child, .dlg .bn-err .acts .btn.link { margin-right: 4px; }
.dlg .bn-err .acts .btn.primary { margin-left: auto; }
.dlg .bn-err[data-kind=host_key_changed] .ttl, .dlg .bn-err[data-kind=host_key_changed] .ttl .gl { color: var(--signal-text); }
.dlg .bn-err .msg { display: block; overflow-wrap: anywhere; color: var(--ink-2); }
.dlg .bn-err .pyrow { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.dlg .bn-err .pyrow label { font-weight: 500; }
.dlg .bn-err .inset { max-height: 160px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.dlg > div > .ttl { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.dlg .flash { margin: 10px 0 0; color: var(--ink); }
.dlg .steps ~ .meta { margin: 10px 0 0; }
.steps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 20px 96px minmax(0, 1fr); column-gap: 8px; align-items: start; }
.steps .gl { margin-top: 2px; }
.steps b { font-weight: 600; }
.steps .d { color: var(--ink-2); overflow-wrap: anywhere; }
.steps .d.mono { font-size: 12px; }
.steps li[data-st=pending] .gl { color: var(--ink-2); }
.steps li[data-st=pending] b { color: var(--ink-2); }
.steps li[data-st=active] .gl { color: var(--ink); }
.steps li[data-st=user] .gl { color: var(--signal); }
.steps li[data-st=error] .gl { color: var(--ink); }
.steps li[data-st=error] b { color: var(--ink); }
.dlg .bn-err + .steps { margin-top: 14px; }
/* entry points */
.shd { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cacts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.clist > .meta { padding: 12px 0; }
@media (max-width: 700px) {
  .dlg .frow, .dlg .frow.pair { grid-template-columns: minmax(0, 1fr); }
  .dlg .frow > label { line-height: 20px; }
  .dlg .frow.pair > label + .fc + label { padding-left: 0; margin-top: 6px; }
  .steps li { grid-template-columns: 20px minmax(0, 1fr); }
  .steps li .d { grid-column: 2; }
}
.pchips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
.pchips .meta { margin-right: 4px; }
.pchip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.dlg .bperm { margin-top: 6px; }
.dlg .field .eye { height: 24px; min-width: 24px; padding: 0 4px; flex: none; }
.dlg .sess { display: flex; gap: 8px; align-items: flex-start; margin: 4px 0 8px; font-size: 13px; }
.dlg .sess input { margin-top: 4px; }
.dlg .confirm { display: grid; gap: 6px; margin: 12px 0 0; padding: 10px 12px; border: 1.5px solid var(--signal); border-radius: var(--r-card); border-top-left-radius: 4px; background: var(--tint-signal); }
.dlg .confirm .ah { color: var(--signal-text); font-weight: 600; }
.dlg .confirm p { margin: 0; }
.dlg .confirm .fp { display: block; padding: 6px 10px; border-radius: var(--r-btn); background: var(--surface); font-size: 12.5px; word-break: break-all; user-select: all; }
code.nw, .nw { white-space: nowrap; }
.dlg .bn-err[data-kind=host_key_changed] .acts .btn:not(.primary):not(.link) { flex-basis: 100%; order: 2; }
.dlg .bn-err[data-kind=host_key_changed] .acts .btn.primary { order: 1; }
.pchip[aria-pressed=true] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.dlg [tabindex="-1"]:focus, .dlg [tabindex="-1"]:focus-visible { outline: none; }
/* key_rejected: what the diagnosis found, and the exact commands a fix runs */
.dlg .finds { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 6px; }
.dlg .finds li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; overflow-wrap: anywhere; }
.dlg .finds .lv { padding: 0 6px; border: 1px solid var(--line); border-radius: var(--r-btn); font-size: 11.5px; line-height: 18px; white-space: nowrap; color: var(--ink-2); }
.dlg .finds li[data-lv=fix] .lv { border-color: var(--signal); color: var(--signal-text); }
.dlg .finds li[data-lv=admin] .lv { border-color: var(--ink); color: var(--ink); }
.dlg .fixcmd { display: block; margin: 0; padding: 6px 10px; border-radius: var(--r-btn); background: var(--surface); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; }
.dlg .bn-err .finds { margin: 8px 0 2px; }
/* 유휴 세션 정리 (69-reap.js) */
.dlg.reap { width: min(600px, calc(100vw - 32px)); }
.reap-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 8px; font-size: 12.5px; }
.reap-list { list-style: none; margin: 0; padding: 0; max-height: 46vh; overflow: auto; border: 1px solid var(--line); border-radius: var(--r-card); }
.reap-list:empty { display: none; }
.reap-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.reap-row:last-child { border-bottom: 0; }
.reap-row label { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; cursor: pointer; }
.reap-row .rmain { display: flex; flex-direction: column; min-width: 0; }
.reap-row .rn, .reap-row .rd { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reap-row .rago { flex: none; color: var(--ink-2); }
.reap-row .rres { flex: none; font-weight: 600; }
.reap-row .rres.bad { color: var(--signal); }
.reap-row .rres[hidden] { display: none; }
.reap-msg { min-height: 18px; margin: 10px 0 0; }
/* 내 SSH 설정에서 고르기 (prefill only) and the manual key route for key-only servers */
.dlg .scrow { margin: -4px 0 10px; }
.dlg .scrow[hidden], .dlg .sshc[hidden], .dlg .manual[hidden] { display: none; }
.dlg .sshc { display: grid; gap: 4px; max-height: 220px; overflow: auto; margin: 0 0 12px; padding: 4px; border: 1px solid var(--line); border-radius: var(--r-card); }
.dlg .sshc > .meta { margin: 4px 6px; }
.dlg .scb { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); column-gap: 8px; align-items: baseline; width: 100%; min-width: 0; padding: 6px 8px; border: 0; border-radius: var(--r-btn); background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.dlg .scb b, .dlg .scb .meta { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dlg .scb b { font-weight: 600; }
.dlg .scb:hover:not(:disabled), .dlg .scb:focus-visible { background: var(--canvas); outline: none; }
.dlg .scb:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
.dlg .scb:disabled { cursor: default; color: var(--ink-2); }
.dlg .scb .scw { grid-column: 1 / -1; font-size: 12px; line-height: 16px; color: var(--ink-2); }
.dlg .scb[data-st=added] .scw::before { content: "✓ "; }
.dlg .manw { margin: 8px 0 0; }
.dlg .manual { display: grid; gap: 4px; margin: 8px 0 0; padding: 10px 12px; border-radius: var(--r-btn); background: var(--canvas); min-width: 0; }
.dlg .manual p { margin: 0; }
.dlg .manual .fixcmd { font-size: 12px; max-height: 120px; overflow: auto; word-break: break-all; }
.dlg .manual .mact { display: flex; justify-content: flex-end; }
.dlg .manual .kmsg[hidden] { display: none; }
.dlg .bn-err .manual { margin: 6px 0 0; background: var(--surface); }
.dlg .scrow .btn.link, .dlg .manw .btn.link { color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; padding: 0; }
.dlg .scrow .btn.link:hover, .dlg .manw .btn.link:hover { color: var(--ink); }

/* ---- 39-talk.css ---- */
/* ===== 39-talk.css — talk cards, name line, composer, confirm card, delivery states, 흐름 tree (TALK-UX). Tokens only; no hex. ===== */
/* talk card: the spawn-card family (radius 12, speaker-side top corner 4) */
.msg.ag .col:has(.talk), .msg.ag .col:has(.who:not([hidden])), .msg .col:has(.spe:not([hidden])) { width: min(72%, 640px); }
.bub.talk { display: block; padding: 10px 12px; border-radius: var(--r-card); border-top-left-radius: 4px; white-space: normal; }
.bub.talk .th { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12.5px; line-height: 18px; font-weight: 600; color: var(--ink-2); }
.bub.talk .th svg { width: 12px; height: 12px; fill: currentColor; flex: none; }
.bub.talk .thl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bub.talk .thr { font-weight: 500; flex: none; }
.tb { margin-top: 2px; font-size: 14px; line-height: 21px; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.tb.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--n, 3); overflow: hidden; }
.tb.open { max-height: 60vh; overflow: auto; }
.tb.enc { color: var(--ink-2); }
.bub.spawn .tb { margin-top: 0; }
.spe, .fvw { display: flex; align-items: flex-start; gap: 6px; min-width: 0; }
.spe .tb, .fvw .tb { flex: 1; min-width: 0; }
.spe .flk, .fvw .flk { flex: none; margin-top: 5px; color: var(--ink-2); }
.flk svg { width: 12px; height: 12px; fill: currentColor; display: block; }
.tf { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; font-size: 12.5px; line-height: 18px; color: var(--ink-2); }
.tf .tfr { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
.tf .btn.link { color: var(--ink-2); font-size: 12.5px; line-height: 18px; }
.tf .btn.link:hover { color: var(--ink); }
/* my talk: outlined = sent from here (peer authority); the filled bubble stays the terminal prompt */
.bub.talkme { border: 1.5px solid var(--accent); background: var(--surface); border-radius: var(--r-bubble); border-top-right-radius: 4px; }
.bub.talkme .th { color: var(--ink-2); }
/* delivery state */
.ds { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--ink-2); }
.ds .gl { width: 12px; height: 12px; color: inherit; vertical-align: 0; }
.ds.held { color: var(--signal-text); font-weight: 600; }
.ds.bad, .ds.exp { color: var(--ink); font-weight: 600; }
/* name line (group chat): the speaker's avatar sits in the normal .av slot */
.who { display: flex; align-items: center; gap: 6px; margin: 0 0 3px 2px; font-size: 12.5px; line-height: 18px; min-width: 0; }
.who .wn { max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; }
.who .wn:hover:not(:disabled) { text-decoration: underline; }
.who .wn:disabled { cursor: default; }
.av.gen .avs { display: none; }
/* the fan-out line and other system lines that carry a link */
.sysl .btn.link { display: inline; font-size: inherit; line-height: inherit; color: var(--ink); text-decoration: underline; }

/* footer = status row + composer row, one block with one hairline */
#foot { flex: none; background: var(--surface); border-top: 1px solid var(--line); }
#foot #sbar { border-top: 0; }
.stalk { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--signal-text); font-weight: 600; }
.stalk.calm { color: var(--ink-2); font-weight: 500; }
.trow { padding: 0 16px 12px; }
.cmp { display: flex; align-items: flex-end; gap: 8px; }
.cmw { flex: 1; min-width: 0; }
.cta { display: block; width: 100%; height: 40px; max-height: 124px; resize: none; border: 0; border-radius: var(--r-btn); background: var(--canvas); color: var(--ink); padding: 9px 12px; font: inherit; line-height: 21px; overflow-y: auto; }
.cta::placeholder { color: var(--ink-2); }
.cta:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.csend { flex: none; min-width: 72px; }
.ccnt { margin-top: 2px; text-align: right; font-size: 12.5px; line-height: 18px; color: var(--ink-2); }
.ccnt.over { color: var(--ink); font-weight: 600; }
.coff { display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 12.5px; line-height: 18px; color: var(--ink-2); }
.coff .gl { margin: 0; flex: none; }
.coff .cop { margin-left: auto; flex: none; }
/* confirm card: in place, not a modal; ink border (not red: nothing needs me yet) */
.confirm { display: grid; gap: 8px; padding: 12px 14px; border: 1.5px solid var(--ink); border-radius: var(--r-card); background: var(--surface); }
.cfh, .cft { font-size: 12.5px; line-height: 18px; font-weight: 600; }
.cfh { color: var(--ink-2); }
.cft { overflow-wrap: anywhere; }
.cfp { max-height: calc(6 * 21px + 20px); overflow: auto; padding: 10px 12px; border-radius: var(--r-btn); background: var(--canvas); white-space: pre-wrap; overflow-wrap: anywhere; }
.cfls { display: grid; gap: 4px; }
.cfls:empty { display: none; }
.cfl { display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; line-height: 18px; font-weight: 600; }
.cfl .gl { width: 12px; height: 12px; margin-top: 3px; }
.cfn { font-size: 12.5px; line-height: 18px; color: var(--ink-2); }
.cfb { display: flex; justify-content: flex-end; gap: 8px; }

/* 대화 | 흐름 toggle in the room header */
.hlinks .fseg { padding: 2px; }
.hlinks .fseg button { height: 24px; padding: 0 10px; font-size: 12.5px; }

/* 흐름: the drawer tree widened, with the text of each node */
#flow { position: absolute; inset: 0; z-index: 2; overflow-y: auto; padding-bottom: 24px; background: var(--canvas); outline: none; }
.fhead { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; margin: 16px 24px 0; }
.fhl { flex: 1; min-width: 220px; }
.fsum { font-weight: 600; color: var(--ink); }
.fhr { display: flex; align-items: center; gap: 12px; }
.fsw { display: inline-flex; align-items: center; gap: 8px; }
.fnote { margin: 8px 24px 0; }
#flow .ftree { margin: 12px 24px 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
.tn.fn { height: auto; overflow: visible; align-items: stretch; padding: 0 16px 0 12px; }
.tn.fn .tg { align-self: start; margin-top: 14px; }
.fn .tbody { align-self: stretch; padding: 8px 0; }
.fn + .fn .tbody { border-top: 1px solid var(--line); }
.fn.cur { background: var(--canvas); }
.ftree .tn .c { width: 20px; }
.ftree .tn .c.v::before, .ftree .tn .c.e.t::after { left: 9px; }
.ftree .tn .c.e::before { left: 9px; width: 11px; }
.ftree .tn .c.e:first-child:last-child::before { display: block; }   /* the root row is row 0: its children get an elbow too */
.tn.fn .t1 { height: 28px; gap: 8px; }
.tn.fn .dt-nm { font-size: 15px; line-height: 22px; }
.fn .av { width: 28px; height: 28px; border-radius: 9px; }
.fn .av .amk { width: 16px; height: 16px; }
.fn .av .avs { width: 14px; height: 14px; right: -4px; bottom: -4px; }
.fn .av .avs .gl { width: 11px; height: 11px; }
.fn .fst { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; flex: none; font-size: 12.5px; color: var(--ink-2); }
.fn .fst .gl { width: 12px; height: 12px; }
.fn .fst .el { margin-left: 0; }
.fn .ft { display: grid; gap: 2px; margin-top: 4px; padding-left: 36px; }
.fn .ft:empty { display: none; }
.fl { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; column-gap: 6px; align-items: start; }
.fk { font-size: 12.5px; line-height: 21px; font-weight: 600; color: var(--ink-2); white-space: nowrap; text-align: left; }
button.fk { border: 0; background: none; padding: 0; cursor: pointer; }

<script>
'use strict';

/* ---- 50-core.js ---- */
/* ===== 50-core.js (lead) — escape/DOM helpers, keyed renderer, settings, data layer, router, keys.
   Packages use ONLY this surface: R.*, and the C.* components in 52-components.js.
   Rules: agent-derived strings reach the DOM through textContent / h() / esc() only. No innerHTML with data.
   Updates are keyed and in place: R.keyed() reuses nodes, R.text()/R.attr() write only on change. ===== */
const R = (() => {
  // ---------- strings ----------
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v, d = 0) => (Number.isFinite(+v) && v !== null && v !== '' ? +v : d);
  const str = (v, max = 4000) => { const s = v == null ? '' : String(v); return s.length > max ? s.slice(0, max) + '…' : s; };

  // ---------- DOM ----------
  // h('div.cls#id', {class, title, data: {...}, on: {click}, aria: {...}, attr...}, ...kids). Strings become text nodes.
  function h(spec, attrs, ...kids) {
    if (attrs instanceof Node || typeof attrs === 'string' || Array.isArray(attrs)) { kids.unshift(attrs); attrs = null; }
    const [tag, ...rest] = spec.split(/(?=[.#])/);
    const svg = tag === 'svg' || tag === 'use' || tag === 'path' || tag === 'circle' || tag === 'rect';
    const el = svg ? document.createElementNS('http://www.w3.org/2000/svg', tag) : document.createElement(tag || 'div');
    for (const r of rest) r[0] === '.' ? el.classList.add(r.slice(1)) : (el.id = r.slice(1));
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.setAttribute('class', (el.getAttribute('class') || '') + ' ' + v);
      else if (k === 'data') for (const [dk, dv] of Object.entries(v)) el.dataset[dk] = dv;
      else if (k === 'on') for (const [ek, fn] of Object.entries(v)) el.addEventListener(ek, fn);
      else if (k === 'aria') for (const [ak, av] of Object.entries(v)) el.setAttribute('aria-' + ak, av);
      else if (k === 'href' && svg) el.setAttribute('href', v);
      else if (k === 'style') el.style.cssText = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    add(el, kids);
    return el;
  }
  function add(el, kids) { for (const k of kids) { if (k == null || k === false) continue; Array.isArray(k) ? add(el, k) : el.append(k instanceof Node ? k : document.createTextNode(String(k))); } }
  const svgUse = (id, cls) => h('svg', { class: cls, 'aria-hidden': 'true' }, h('use', { href: '#' + id }));
  function text(el, s) { s = s == null ? '' : String(s); if (el.textContent !== s) el.textContent = s; return el; }
  function attr(el, k, v) { if (v == null || v === false) { if (el.hasAttribute(k)) el.removeAttribute(k); } else { v = v === true ? '' : String(v); if (el.getAttribute(k) !== v) el.setAttribute(k, v); } return el; }
  function cls(el, name, on) { el.classList.toggle(name, !!on); return el; }
  // swap one st-* class without touching the others
  function stClass(el, st) { for (const c of [...el.classList]) if (c.startsWith('st-') && c !== 'st-' + st) el.classList.remove(c); el.classList.add('st-' + st); }
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  // Keyed in-place list renderer. items: array; key(item) -> string; create(item) -> element; update(el, item, i).
  // Reuses elements by data-key, writes only through update(), moves nodes only when order changed,
  // never removes an element that holds focus (marks it .gone instead; removed on the next pass when unfocused).
  function keyed(parent, items, { key, create, update, keepGone = true }) {
    const want = new Set(items.map(it => String(key(it)))), have = new Map();
    for (const el of [...parent.children]) if (el.dataset.key != null) {   // drop stale nodes first: otherwise every node after the first stale one is re-inserted (selection lost)
      if (want.has(el.dataset.key)) have.set(el.dataset.key, el); else if (keepGone && el.contains(document.activeElement)) el.classList.add('gone'); else el.remove();
    }
    const seen = new Set(), act = document.activeElement;   // re-inserting the focused row blurs it in Chrome: restore below
    let cursor = parent.firstElementChild;
    for (let i = 0; i < items.length; i++) {
      const it = items[i], k = String(key(it));
      if (seen.has(k)) continue;   // duplicate key in one pass: first wins
      seen.add(k);
      let el = have.get(k);
      if (!el) { el = create(it, i); el.dataset.key = k; }
      else el.classList.remove('gone');
      update && update(el, it, i);
      if (el === cursor) cursor = cursor.nextElementSibling;   // already in place
      else parent.insertBefore(el, cursor);                      // new or moved: goes right before the cursor
    }
    for (const [k, el] of have) if (!seen.has(k)) {
      if (keepGone && el.contains(document.activeElement)) el.classList.add('gone');
      else el.remove();
    }
    if (document.activeElement === document.body && act && act !== document.body && parent.contains(act)) act.focus({ preventScroll: true });
  }
  // Run fn (which may reorder rows) while keeping `anchor` at the same viewport offset inside `scroller`.
  function keepScroll(scroller, anchor, fn) {
    if (!anchor || !scroller) return fn();
    const before = anchor.getBoundingClientRect().top;
    fn();
    if (anchor.isConnected) scroller.scrollTop += anchor.getBoundingClientRect().top - before;
  }

  // ---------- time ----------
  const pad = n => String(n).padStart(2, '0');
  function fmtDur(sec) {                    // 12초 / 5분 / 1시간 12분 / 2일 3시간 (DIRECTION §12)
    sec = Math.max(0, Math.round(num(sec)));
    if (sec < 60) return sec + '초';
    const m = Math.floor(sec / 60) % 60, hh = Math.floor(sec / 3600), d = Math.floor(hh / 24);
    if (hh < 1) return m + '분';
    if (d < 1) return m ? hh + '시간 ' + m + '분' : hh + '시간';
    return (hh % 24) ? d + '일 ' + (hh % 24) + '시간' : d + '일';
  }
  // collector durations ('25m', '1h12m', '40s') -> Korean; applied to why/now/last only (never commands), word-bounded so 'gpt-5.1' stays
  const koText = s => /^\$ /.test(s) ? s : koDur(s);   // '$ sleep 30s' is a command: shown and copied verbatim
  const koDur = s => s.replace(/\b(\d+)h(\d+)m\b/g, '$1시간 $2분').replace(/\b(\d+)h\b/g, '$1시간').replace(/\b(\d+)m\b/g, '$1분').replace(/\b(\d+)s\b/g, '$1초');
  const fmtLive = sec => sec < 10 ? '방금' : fmtDur(sec) + '째';
  // errored ssh channel: Korean next step chosen from the real error text (the text itself is shown separately, via textContent)
  // order matters: a changed key prints the WARNING block *and* "Host key verification failed"
  // "Bad owner or permissions on <path>": the constant fix below only touches %USERPROFILE%\.ssh\config, so it is offered only
  // when that is the file named (or no file is named). Any other file (e.g. C:\ProgramData\ssh\ssh_config) -> kind 'badpermx'.
  const badpermPath = e => { const m = /Bad owner or permissions on (.+)$/m.exec(String(e || '')); return m ? m[1].trim().replace(/^["']+|["':]+$/g, '') : ''; };
  const profileOf = p => { const m = /^([A-Za-z]:[\\/]+Users[\\/]+[^\\/]+)[\\/]/i.exec(String(p || '')); return m ? m[1].replace(/[\\/]+/g, '\\').toLowerCase() : ''; };
  function ownSshConfig(p) {
    if (!p) return true;
    if (/^(?:%USERPROFILE%|\$env:USERPROFILE|~)[\\/]+\.ssh[\\/]+config$/i.test(p)) return true;
    if (!/^[A-Za-z]:[\\/]+Users[\\/]+[^\\/]+[\\/]+\.ssh[\\/]+config$/i.test(p)) return false;
    const mine = M.app && profileOf(M.app.logdir + '\\');   // the hub's log dir lives in the user's profile: when known, the names must match

/* ---- 64-import.js ---- */
/* ===== 64-import.js — 서버 목록 가져오기 (APP-UX §2): a .json file the company shares -> POST api/presets/import. Result copy is exact per APP-UX §2.

      let raw, parsed; try { raw = await f.text(); } catch { return show('파일을 읽을 수 없습니다 — JSON 형식이 아닙니다', true); }
      try { parsed = JSON.parse(raw); } catch { return show('파일을 읽을 수 없습니다 — JSON 형식이 아닙니다', true); }
      const list = Array.isArray(parsed) ? parsed : parsed && typeof parsed === 'object' && Array.isArray(parsed.presets) ? parsed.presets : null;
      if (!list || !list.length) return show('서버 목록 파일이 아닙니다 — 회사에서 받은 .json 파일을 고르세요', true);
      const before = R.M.presets.length; let r; try { r = await R.apiPost('api/presets/import', raw); } catch { r = { status: 0 }; }
      if (r.status === 413) return show('파일이 너무 큽니다 (64 KB 까지)', true);
      if (r.status === 400) return show('서버 목록 파일이 아닙니다 — 회사에서 받은 .json 파일을 고르세요', true);
      if (!r.ok || !r.body) return show('가져오지 못했습니다 — 허브에 연결할 수 없습니다', true, true);

      if (a === 0 && d > 0 && !inv) return show('새로 가져온 서버가 없습니다 — ' + d + '개 모두 이미 목록에 있습니다', false);

      if (inv > 0) return show('서버 ' + a + '개를 가져왔습니다 · ' + inv + '개는 형식이 맞지 않아 건너뜀 (host·port 확인)', false);

/* ---- 65-notify.js ---- */
/* ===== 65-notify.js — toasts + Windows notifications (CHAT-UX §7). Triggers and one-per-transition rules unchanged from DIRECTION §10.
   A toast is a list-row look-alike (avatar + title + preview) bottom-right; shown only when the room is not the open room. ===== */
(() => {
  const { h, text, attr, M, S, U, on, ST, LIVE } = R;
  // ---------- classification ----------
  const toWait = e => (e.type === 'chan' && e.to === 'error') || e.type === 'start' && (e.to === 'user' || e.to === 'stall') || e.type === 'status' && (e.to === 'user' || e.to === 'stall' || ((e.to === 'stopped' || e.to === 'dead') && (LIVE.has(e.from) || e.from === 'user')));

  const readWait = e => toWait(e) && e.type !== 'chan' && e.agent && R.M.agents.get(e.key) === e.agent && !R.needsMe(e.agent);   // 읽음 / 작업 완료: this episode was already seen
  const notable = e => (toWait(e) && !readWait(e)) || longProc(e);              // toast + Windows notification set
  const reason = e => { const a = e.agent || {}; if (e.type === 'talk') return ''; if (e.type === 'chan') { const c = R.chan(e.ch); return e.to === 'error' ? String(c && c.error || '').split('\n')[0] : ''; } return e.type === 'proc-done' ? String(e.cmd || '') : e.to === 'user' ? (a.now || a.why || '') : (a.why || ''); };
  const toastSentence = e => e.type === 'talk' ? (e.kind === 'held' ? '보낸 톡이 터미널에서 승인을 기다립니다 (5분)' : e.kind === 'unreach' ? '보낸 톡이 연결 안 됨으로 닿지 못했습니다' : '보낸 톡이 거절되었습니다') : e.type === 'chan' ? '연결이 끊겼습니다 — 이 채널의 에이전트 상태를 확인할 수 없습니다' : e.type === 'proc-done' ? '오래 걸린 작업이 끝났습니다 (' + R.fmtDur(e.dur) + (e.cmd ? ', ' + R.str(e.cmd, 40) : '') + ')'
    : { user: '입력을 기다립니다', stall: '응답이 없습니다', stopped: '중단되었습니다', dead: '연결이 끊겼습니다' }[e.to];
  const title = e => e.type === 'chan' ? R.chName(e.ch) : e.type === 'talk' && e.kind === 'held' ? '터미널 승인 필요 — ' + ((e.agent && e.agent.name) || '?') : (e.agent && e.agent.name) || '?';
  const openIt = e => { if (e.type === 'chan') R.openChannel(e.ch); else if (e.agent) R.openRoom(e.agent.ch, e.agent.id); };

  // ---------- toasts ----------
  const stack = h('div#toasts', { role: 'status', 'aria-live': 'polite' });
  document.getElementById('layer').append(stack);
  const reduced = () => document.documentElement.dataset.motion === 'reduce' || (document.documentElement.dataset.motion !== 'full' && matchMedia('(prefers-reduced-motion: reduce)').matches);

  }

    if (e.type !== 'chan' && e.type !== 'talk' && U.room === e.key) return;                            // the open room already shows it
    for (const t of [...stack.children]) if (t._key === e.key) t.remove();       // one toast per agent
    const av = e.type === 'chan' ? h('span.av', C.glyph('dead')) : C.avatar({ tool: a.tool || 'claude', st: e.to || 'idle', parent: null });
    const t = h('div.toast', av, h('div.tx', h('b', title(e)), h('div.meta', toastSentence(e) + (reason(e) && e.type !== 'proc-done' ? ' · ' + R.str(reason(e), 80) : ''))),
      h('div.ta', h('button.btn.sm', { type: 'button', on: { click: () => { openIt(e); dismiss(t); const n = notes.get(e.key); if (n) { n.close(); notes.delete(e.key); } } } }, '열기'),
        h('button.x', { type: 'button', 'aria-label': '닫기', title: '닫기', on: { click: () => dismiss(t) } }, '×')));

  }

  const canNotify = () => S.notify && typeof Notification !== 'undefined' && Notification.permission === 'granted';

  on('events', evs => {

    const clear = e => clearKey(e.key);
    for (const e of evs) if (!notable(e) && (e.type === 'gone' || e.type === 'status' || e.type === 'chan')) clear(e);   // any non-notable change clears what was shown; first, so freed slots are reused
    for (const e of [...evs].reverse()) { if (!notable(e)) continue; toast(e); if (canNotify()) notify(e); }
  });
})();

      if (/^[2-9]$/.test(k)) { if (!digits) out.push({ keys: ['2–9'], label: '채널 (순서대로)' }); digits = true; continue; }
      if (k === 'j') { out.push({ keys: ['j', 'k'], label: '다음 / 이전 방' }); continue; }
      if (k === 'k') continue;
      out.push({ keys: [SHOW[k] || k], label: v.label || k });
    }
    return out.concat(FIXED.map(([keys, label]) => ({ keys, label })));
  }
  const TALK_KEYS = [['Enter', '보내기 (한 번 더 눌러 확인)'], ['Shift+Enter', '줄바꿈'], ['Esc', '취소 (글은 남음)']];   // TALK-UX §5.4
  window.Keymap = { table };

  // ---------- fuzzy: subsequence, rewards consecutive runs and word starts; -1 = no match ----------
  function fuzzy(q, s) {
    s = s.toLowerCase(); let i = 0, score = 0, run = 0, last = -2;
    for (let j = 0; j < s.length && i < q.length; j++) if (s[j] === q[i]) {
      run = last === j - 1 ? run + 1 : 0; score += 1 + run * 2 + (j === 0 || /[\s\-_/.:]/.test(s[j - 1]) ? 3 : 0); last = j; i++;
    }
    return i < q.length ? -1 : score - s.length * 0.01;
  }
  const best = (q, fields) => { let b = -1; fields.forEach(([s, w]) => { if (!s) return; const f = fuzzy(q, s); if (f >= 0) b = Math.max(b, f * w); }); return b; };

  // ---------- items ----------
  const THEMES = ['system', 'light', 'dark'], THEME_KO = { system: '시스템', light: '라이트', dark: '다크' };
  function navItems() {
    const out = [{ key: 'go:chat', t: '채팅', ic: 'i-chat', cap: 'Esc', run: () => R.openChannel('all') }, { key: 'go:ch:all', t: '전체 채널', ic: 'i-all', cap: '1', run: () => R.openChannel('all') }];
    M.channels.forEach((c, i) => out.push({ key: 'go:ch:' + c.id, t: c.name, ic: C.chIcon(c), cap: i < 8 ? String(i + 2) : '', run: () => R.openChannel(c.id) }));
    return out.concat([['board', '보드', 'i-board', 'b'], ['settings', '설정', 'i-gear', ',']].map(([id, t, ic, cap]) => ({ key: 'go:' + id, t, ic, cap, run: () => go(id) })));
  }
  const actItems = () => [
    { key: 'act:refresh', t: '새로고침', ic: 'i-down', cap: 'r', run: () => { R.refresh(); R.emit('resort'); } },
    { key: 'act:pause', t: R.isPaused() ? '재개' : '일시정지', ic: R.isPaused() ? 'i-play' : 'i-pause', cap: 'p', run: () => R.setPaused(!R.isPaused()) },
    { key: 'act:theme', t: '테마 전환', s: '현재 ' + THEME_KO[S.theme], ic: 'i-gear', run: () => { S.theme = THEMES[(THEMES.indexOf(S.theme) + 1) % 3]; R.applySettings(); } },
    { key: 'act:kids', t: '하위 에이전트 보기', s: R.U.showKids ? '현재 켜짐' : '현재 꺼짐', ic: 'i-chev', run: () => { R.U.showKids = !R.U.showKids; R.save(); R.emit('resort'); } },
    { key: 'act:addsrv', t: '서버 추가', ic: 'i-server', run: () => AddServer.open({}) },
    ...(Room.canFlow() ? [{ key: 'act:flow', t: Room.flowOn ? '대화 보기' : '흐름 보기', s: '지시가 퍼지는 모양', ic: 'i-chev', cap: 'f', run: () => Room.toggleFlow() }] : []),
  ];
  function agentItems(q) {
    const out = [];
    for (const a of M.agents.values()) {
      const md = C.meta(a), chn = R.chName(a.ch);
      const sc = best(q, [[a.name, 3], [a.tool, 2], [md.model, 1.5], [chn, 2], [a.why, 1], [a.now, 1]]);
      if (sc >= 0) out.push({ key: 'a:' + a.key, sc, a, t: a.name, s: [chn, a.tool].filter(Boolean).join(' · '), kind: a.parent ? '하위' : '방' });
    }
    return out.sort((x, y) => y.sc - x.sc).slice(0, 8);
  }
  function build(raw) {
    const q = raw.toLowerCase().replace(/\s+/g, '');
    let g = [['이동', navItems()], ['동작', actItems()]];
    if (q) {
      g = g.map(([n, it]) => [n, it.map(x => { const sc = best(q, [[x.t, 1], [x.cap, 0.5]]); return { ...x, sc: sc >= 0 && x.t.toLowerCase().replace(/\s+/g, '').startsWith(q) ? sc + 100 : sc }; }).filter(x => x.sc >= 0).sort((a, b) => b.sc - a.sc)]);
      g.push(['방', agentItems(q)]);
      g = g.filter(x => x[1].length).sort((a, b) => b[1][0].sc - a[1][0].sc);     // best-matching group first
    }
    const flat = [];
    for (const [n, it] of g) { flat.push({ key: 'h:' + n, head: n }); for (const x of it) flat.push(x); }
    return flat;
  }

  // ---------- rendering ----------
  function mkRow(it) {
    const kind = it.key.split(':')[0];
    if (kind === 'h') return h('div.pal-h', { role: 'presentation' });
    const r = h('div.pal-r', { class: kind, role: 'option', id: 'pal-o' + (++uid), on: { click: () => run(it.key), mousemove: () => setSel(it.key, false) } },
      kind === 'a' ? C.glyph(it.a.st) : svgUse(it.ic, 'ic'), h('span.m', h('span.t'), h('span.s')), h('span.e'));
    return r;
  }
  function setRow(el, it) {
    if (it.head) return text(el, it.head);
    text(el.querySelector('.t'), it.t); if (it.ic && !it.a) attr(el.querySelector('use'), 'href', '#' + it.ic); attr(el.querySelector('.t'), 'title', it.t);
    text(el.querySelector('.s'), it.s || '');
    const e = el.querySelector('.e');
    if (it.a) { C.setGlyph(el.firstElementChild, it.a.st); text(e, it.kind); }
    else if (it.cap && !e.firstChild) e.append(C.kbd(it.cap));
    else if (it.cap) text(e.firstChild, it.cap);
    else text(e, '');
  }
  function render(scroll) {
    rows = build(input.value);
    const opts = rows.filter(r => !r.head);
    if (!opts.length) rows = [{ key: 'none', none: true }];
    keyed(list, rows, {
      key: r => r.key,
      create: r => r.none ? h('div.pal-none', '일치하는 항목이 없습니다') : mkRow(r),
      update: (el, r) => { if (!r.none) setRow(el, r); },
    });
    if (!opts.some(r => r.key === sel)) sel = opts[0] ? opts[0].key : '';
    paint(scroll);
  }
  function paint(scroll) {
    let act = null;
    for (const el of list.children) { const on = el.dataset.key === sel; if (el.getAttribute('role') === 'option') attr(el, 'aria-selected', on ? 'true' : 'false'); if (on) act = el; }
    attr(input, 'aria-activedescendant', act && act.id);
    if (scroll && act) { act.scrollIntoView({ block: 'nearest' }); if (act.previousElementSibling && !act.previousElementSibling.previousElementSibling) list.scrollTop = 0; }
  }
  function setSel(k, scroll) { if (sel === k) return; sel = k; paint(scroll); }
  function move(d) {
    const opts = rows.filter(r => !r.head && !r.none); if (!opts.length) return;
    const i = opts.findIndex(r => r.key === sel);
    setSel(opts[(i + d + opts.length) % opts.length].key, true);
  }
  function run(k, shift) {
    const it = rows.find(r => r.key === k); if (!it) return;
    close();
    if (it.a) R.openRoom(it.a.ch, it.a.id); else it.run();
  }

  // ---------- open / close ----------
  function open(m, q) {
    if (scrim) close();
    prev = document.activeElement; mode = m;
    scrim = h('div.pal-scrim', { class: m === 'sheet' ? 'sheet' : '', on: { mousedown: e => { if (e.target === scrim) close(); } } });
    scrim.addEventListener('wheel', e => { if (e.target === scrim) e.preventDefault(); }, { passive: false });
    if (m === 'pal') {
      input = h('input', { type: 'text', role: 'combobox', 'aria-label': '검색 또는 명령', placeholder: '검색 또는 명령…', autocomplete: 'off', spellcheck: 'false', 'aria-expanded': 'true', 'aria-controls': 'pal-list', 'aria-autocomplete': 'list' });
      list = h('div.pal-list#pal-list', { role: 'listbox', 'aria-label': '결과' });
      input.addEventListener('input', () => { sel = ''; render(true); });
      input.addEventListener('keydown', onKey);
      scrim.append(h('div.pal', { role: 'dialog', 'aria-modal': 'true', 'aria-label': '검색 또는 명령', on: { mousedown: e => { if (e.target !== input) e.preventDefault(); } } },   // focus never leaves the input
        h('div.pal-in', svgUse('i-search'), input), list,
        h('div.pal-foot', h('span', C.kbd('Esc'), '닫기'), h('span', '열기', C.kbd('↵')))));
      layer.append(scrim); input.value = q || ''; render(true); input.focus({ preventScroll: true });
    } else {
      const dlg = h('div.pal', { role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'sheet-t' },
        h('div.sheet-h', h('span#sheet-t', '단축키'), h('button.ibtn', { type: 'button', 'aria-label': '닫기', on: { click: close } }, C.kbd('Esc'))),
        h('div.sheet-b', { tabindex: '-1' }, table().map(r => h('div.sheet-r', h('span', r.label), h('span.k', r.keys.map(k => C.kbd(k))))),
          h('div.sheet-g', '톡'), TALK_KEYS.map(([k, l]) => h('div.sheet-r', h('span', l), h('span.k', C.kbd(k)))),
          h('div.sheet-leg', '■ 터미널에서 입력한 것 · □ 에겐 톡에서 보낸 메시지')));
      scrim.append(dlg); layer.append(scrim); dlg.querySelector('.sheet-b').focus({ preventScroll: true });   // the scroller holds focus so arrows/PageDown scroll

    if (prev && prev.isConnected) prev.focus({ preventScroll: true }); prev = null;
  }
  // while a dialog is open: keep Tab inside, and let nothing but Esc / ? / Ctrl+K reach the page's global keys
  function trap(e) {
    if (e.key === 'Tab') {
      e.preventDefault();

      return;
    }
    if (e.key === 'Escape') return;
    if (mode === 'sheet' && (e.key === '?' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'))) { e.preventDefault(); e.stopPropagation(); close(); if (e.key !== '?') open('pal'); return; }
    if (mode === 'sheet') { e.stopPropagation(); if (e.key.startsWith('Arrow') || e.key === ' ') return; }

  }

  R.onEsc(() => { if (!scrim) return false; close(); return true; });   // registered after P2 → runs first
  R.on('model', () => { if (mode === 'pal') render(false); });
  R.on('palette', () => (mode === 'pal' ? close() : open('pal')));
  R.key('?', () => (mode === 'sheet' ? close() : open('sheet')), '단축키');
  // screenshot / test overrides, like ?theme=: ?pal=data opens the palette with a query, ?sheet=1 the shortcut sheet
  let qs = new URLSearchParams(location.search);
  if (!qs.has('pal') && !qs.has('sheet')) qs = null;
  if (qs) R.on('model', () => { if (qs) { const q = qs; qs = null; open(q.has('sheet') ? 'sheet' : 'pal', q.get('pal')); } });
})();

/* ---- 68-states.js ---- */
/* ===== 68-states.js — window.States: skeleton / banner / missing (CHAT-UX §6). The hub-down line lives in the list's summary row.
   All elements are cached (banner per channel, empty per kind, missing per session) and patched in place; text via textContent only. ===== */
window.States = (() => {
  const { h, svgUse, text, attr, cls, M, on, $ } = R;
  const nodes = (n, f) => Array.from({ length: n }, f);

  // ---------- skeleton (views call this until M.loaded; the header ring is the only spinner) ----------
  function skeleton(n = 5) {
    return h('div.sk-list', { 'aria-hidden': 'true', class: M.loaded ? 'done' : '' },
      nodes(n, () => h('div.sk-row', h('i.g'), h('i.b1'), h('i.e'), h('i.b2'))));
  }
  on('model', () => R.$$('.sk-list:not(.done)').forEach(el => el.classList.add('done')));   // never shimmer after load

  // ---------- badperm: the PC-side Windows permission fix (constant command, copy button, one more line) ----------
  function badperm() {
    const b = R.BADPERM, btn = h('button.btn.sm', { type: 'button', on: { click: e => C.copy(b.cmd, e.currentTarget, '명령 복사') } }, '명령 복사');
    return h('div.bperm', h('code.mono.bcmd', b.cmd), h('div.bact', btn), h('p.meta', b.extra));
  }

  // ---------- banner(ch): one element per channel; null when ok and no warnings ----------
  const banners = {};
  function mkBanner(ch) {
    const log = h('pre.inset', { hidden: true, id: 'bnlog-' + ch });
    const logBtn = h('button.btn.link', { type: 'button', 'aria-expanded': 'false', 'aria-controls': 'bnlog-' + ch, on: { click: () => { log.hidden = !log.hidden; attr(logBtn, 'aria-expanded', log.hidden ? 'false' : 'true'); } } }, '로그 보기');
    const retry = () => { R.retryChan(ch); again2.disabled = true; text(again2, '확인하는 중…'); setTimeout(() => { again2.disabled = false; text(again2, '지금 확인'); }, 2500); };   // the hub reconnects now, not after its backoff
    const again2 = h('button.btn.primary', { type: 'button', on: { click: retry } }, '지금 확인');
    const fixBtn = h('button.btn.primary', { type: 'button', hidden: true, on: { click: () => AddServer.open({ ch }) } }, '이 서버에 키 등록하기');
    const rekeyBtn = h('button.btn', { type: 'button', hidden: true, title: '키를 다시 등록해 다음부터 비밀번호 없이 연결합니다 (거절되면 원인을 찾아 고칩니다)', on: { click: () => AddServer.open({ ch, rekey: true }) } }, '키 로그인 설정');
    // the hint is one or two short sentences; the raw ssh line sits behind 자세히 (the full text is under 로그 보기)
    const raw = h('code.mono.raw', { hidden: true, id: 'bnraw-' + ch });
    const more = h('button.btn.link.more', { type: 'button', 'aria-expanded': 'false', 'aria-controls': 'bnraw-' + ch, on: { click: () => { raw.hidden = !raw.hidden; attr(more, 'aria-expanded', raw.hidden ? 'false' : 'true'); text(more, raw.hidden ? '자세히' : '접기'); } } }, '자세히');
    const tunnel = h('div.hint', h('span.ht'), ' ', more, raw), sep1 = h('span.sep', '·'), bp = badperm();
    const err = h('div.bn-err', { role: 'alert', hidden: true },
      h('div.ttl', svgUse('g-dead', 'gl'), h('span.t')), h('div.sub', h('span.last'), h('span.nx')), tunnel,
      h('div.acts', bp, sep1, fixBtn, rekeyBtn, logBtn, again2), log);
    const longer = h('span.meta', { hidden: true }, '오래 걸리면 허브 창의 로그와 channels.json의 주소를 확인하세요');
    const conn = h('div.bn-conn', { role: 'status', hidden: true }, h('span', '서버에 연결하는 중입니다…'), longer, h('div.indet', { 'aria-hidden': 'true' }));
    const el = h('div.st-banner', { data: { ch } }, conn, err);
    el._p = { err, conn, log, logBtn, tunnel, raw, more, bp, sep1, longer, fixBtn, rekeyBtn, again2 };
    return el;
  }
  function banner(ch) {
    const c = R.chan(ch);
    if (!c) return null;
    if (c.state === 'ok' && !c.stale) { if (banners[ch]) banners[ch].remove(); return null; }
    const el = banners[ch] || (banners[ch] = mkBanner(ch)), p = el._p;
    p.conn.hidden = c.state !== 'connecting';
    el._since = c.state === 'connecting' ? el._since || Date.now() : 0;
    p.longer.hidden = !el._since || Date.now() - el._since < 30000;
    const bad = c.state === 'error' || (c.state === 'ok' && c.stale);
    p.err.hidden = !bad;
    if (bad) {
      const ssh = c.kind === 'ssh' && c.state === 'error';
      const bpm = ssh && R.sshKind(c.error) === 'badperm'; p.bp.hidden = !bpm;
      text(p.err.querySelector('.t'), bpm ? R.BADPERM.title : c.state === 'ok' ? '수집이 중단되었습니다' : ssh ? 'SSH 연결이 끊겼습니다' : '연결 오류');
      const pws = ssh && c.auth === 'password-session';   // the server refused our key: this run connects with a password
      const waitPw = pws && !c.session_pw;                 // ...and the hub has none yet: it will not retry on its own
      text(p.err.querySelector('.sub .last'), (c.t ? '마지막 수집 ' + R.fmtHM(c.t) : '아직 받은 데이터가 없습니다') + (c.state === 'error' ? ' · ' : ''));   // then '12초 뒤 다시 연결' / '연결 중…' / '비밀번호를 기다리는 중', ticking locally
      R.setRetry(p.err.querySelector('.sub .nx'), c.state === 'error' ? c : null); attr(p.err.querySelector('.sub'), 'title', waitPw ? null : '허브가 자동으로 다시 연결합니다 (최대 1분 간격)');
      const fx = R.sshFix(c); p.fixBtn.hidden = !fx; p.rekeyBtn.hidden = !pws; cls(p.again2, 'primary', !fx); cls(p.again2, 'link', fx);
      p.again2.hidden = waitPw;   // nothing to retry until a password is typed: 비밀번호로 연결 is the way
      text(p.fixBtn, pws ? '비밀번호로 연결' : '이 서버에 키 등록하기');
      p.tunnel.hidden = !ssh; p.sep1.hidden = true;
      if (ssh) {
        text(p.tunnel.querySelector('.ht'), pws ? '이 서버는 키 로그인이 안 돼서, 이번 실행에서는 비밀번호가 필요합니다.' : R.sshHint(c.error));
        const line = R.sshErr(c.error); text(p.raw, line); p.more.hidden = !line; if (!line) p.raw.hidden = true;
      }
      text(p.log, c.error || '허브가 오류 내용을 보내지 않았습니다');
      if (!ssh && c.state === 'error' && p.log.hidden && !p.log.dataset.seen) { p.log.hidden = false; p.log.dataset.seen = '1'; attr(p.logBtn, 'aria-expanded', 'true'); }   // non-ssh: the error text is the content, show it once
    }
    return el;
  }

  // ---------- missing(ch, id): session info unavailable; P3 places the dimmed last tree under it ----------
  const missings = {};
  function missing(ch, id) {
    const k = ch + '\n' + id;
    if (!missings[k]) {
      missings[k] = h('div.missing', { role: 'alert' },
        h('h3', svgUse('i-flag'), '세션 정보를 가져오지 못했습니다'),
        h('ul', h('li', '채널 연결이 끊겼을 수 있습니다 — 채널 연결 상태를 확인하세요'), h('li', '세션이 이미 종료되어 목록에서 사라졌을 수 있습니다'), h('li', '이 세션을 읽을 권한이 없을 수 있습니다')),
        h('div.acts', h('button.btn.primary', { type: 'button', on: { click: () => R.refresh() } }, '다시 시도')));
    }
    return missings[k];
  }

  return { skeleton, banner, missing, badperm };
})();

/* ---- 69-addserver.js ---- */
/* ===== 69-addserver.js — 서버 추가 dialog (IN-APP-SSH-ENG §3/§5). window.AddServer.open({ch?, host?, port?, name?}).
   Host, port, account and password are typed here; the password goes only into the POST body, is cleared from the field right after submit
   and is never kept by the page. Hub strings go through textContent only.
   key_rejected: the hub diagnoses over the still-open password session and waits in state confirm_fix; the card lists what it found and
   the exact fix commands, the answer goes to api/servers/job/confirm {action: 'fix', choice: fix | session | none}.
   open({ch, rekey: true}) on a password-session channel = 키 로그인 다시 설정 (reuses this run's password when the hub still has it). ===== */
window.AddServer = (() => {
  const { h, svgUse, text, attr, cls, M } = R;
  const TOKEN = (document.querySelector('meta[name=at-token]') || {}).content || '';
  const RE = { user: /^[A-Za-z_][A-Za-z0-9._-]{0,31}$/ };   // hosts: R.hostOk (names with . _ -, IPv4, bare IPv6)
  const STEPS = ['연결', '서버 확인', '키 등록', '접속 확인', '채널 등록'], GL = { pending: 'g-idle', active: 'g-work', user: 'g-user', done: 'g-done', error: 'g-dead' };
  const PH = { connecting: 0, confirm_hostkey: 1, installing_key: 2, verifying: 3, diagnosing: 3, confirm_fix: 3, fixing: 3 };
