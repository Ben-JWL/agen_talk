    if (!p) return true;
    if (/^(?:%USERPROFILE%|\$env:USERPROFILE|~)[\\/]+\.ssh[\\/]+config$/i.test(p)) return true;
    if (!/^[A-Za-z]:[\\/]+Users[\\/]+[^\\/]+[\\/]+\.ssh[\\/]+config$/i.test(p)) return false;

    return !mine || profileOf(p) === mine;
  }
  const sshKind = e => { e = String(e || ''); return /REMOTE HOST IDENTIFICATION HAS CHANGED/i.test(e) ? 'hostchanged' : /Host key verification failed/i.test(e) ? 'hostkey' : /Bad owner or permissions on/i.test(e) ? (ownSshConfig(badpermPath(e)) ? 'badperm' : 'badpermx') : /Permission denied/i.test(e) ? 'perm' : /Could not resolve|Connection refused|timed out|No route/i.test(e) ? 'net' : /python3?: (not found|No such file)|command not found/i.test(e) ? 'nopy' : /No such file or directory|WinError 2|지정된 파일/i.test(e) ? 'nossh' : 'other'; };
  const HINT = {
    hostkey: '처음 연결하는 서버입니다 — 키 등록하기 버튼으로 호스트 키를 확인하고 접속을 등록하세요.',
    perm: '키 로그인이 되지 않습니다 — 키 등록하기 버튼으로 비밀번호를 한 번만 입력해 등록하세요.',
    hostchanged: '서버의 신원이 바뀌었습니다 — 서버 관리자에게 확인하기 전에는 접속하지 마세요. 확인 후 키 등록하기로 다시 등록합니다.',
    net: '서버에 닿지 않습니다. 주소·포트·네트워크(VPN)를 확인하세요.',
    nopy: '서버에 python3 가 없습니다. channels.json 의 python 값을 확인하세요.',
    nossh: 'ssh 프로그램을 찾지 못했습니다. Windows 설정에서 OpenSSH 클라이언트를 설치하세요.',
    badperm: 'Windows가 이 PC의 ssh 설정 파일 권한을 거부했습니다 — 서버 문제가 아니라 이 PC의 권한 문제입니다. 아래 명령을 PowerShell에 붙여 넣으세요.',
  };

/* ---- 67-palette.js ---- */
/* ===== 67-palette.js — command palette (Ctrl+K only; / now focuses the list search), shortcut sheet (?), window.Keymap.
   Agent text reaches the DOM only through textContent (R.text / h()). ===== */
(() => {
  const { h, svgUse, text, attr, cls, $, keyed, M, S, go, ST } = R;
  const layer = $('#layer');
  let scrim = null, input, list, prev = null, mode = null, sel = '', rows = [];   // mode: 'pal' | 'sheet'
  let uid = 0;

  // ---------- keymap (P7 renders the same table) ----------
  const SHOW = { ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓' };
  const FIXED = [
    [['↑', '↓'], '목록에서 방 고르기'], [['Enter'], '방 열기'], [['Esc'], '닫기 (팔레트 → 검색 → 세션 정보 → 방)'],
    [['←', '→'], '하위 트리 접기 / 펼치기'], [['Shift+→'], '하위 트리 모두 펼치기'], [['Ctrl+K'], '명령 팔레트'],
  ];
  function table() {
    const out = []; let digits = false;
    for (const [k, v] of Object.entries(R.keys)) {
      if (k.startsWith('Arrow')) continue;     // covered by the fixed rows
      if (k === '1') { out.push({ keys: ['1'], label: '전체' }); continue; }
      if (/^[2-9]$/.test(k)) { if (!digits) out.push({ keys: ['2–9'], label: '채널 (순서대로)' }); digits = true; continue; }
      if (k === 'j') { out.push({ keys: ['j', 'k'], label: '다음 / 이전 방' }); continue; }
      if (k === 'k') continue;
      out.push({ keys: [SHOW[k] || k], label: v.label || k });
    }
    return out.concat(FIXED.map(([keys, label]) => ({ keys, label })));
  }
  const TALK_KEYS = [['Enter', '보내기 (한 번 더 눌러 확인)'], ['Shift+Enter', '줄바꿈'], ['Esc', '취소 (글은 남음)']];   // TALK-UX §5.4
  window.Keymap = { table };

  // ---------- fuzzy: subsequence, rewards consecutive runs and word starts; -1 = no match ----------
  function fuzzy(q, s) {
    s = s.toLowerCase(); let i = 0, score = 0, run = 0, last = -2;
    for (let j = 0; j < s.length && i < q.length; j++) if (s[j] === q[i]) {
      run = last === j - 1 ? run + 1 : 0; score += 1 + run * 2 + (j === 0 || /[\s\-_/.:]/.test(s[j - 1]) ? 3 : 0); last = j; i++;
    }
    return i < q.length ? -1 : score - s.length * 0.01;
  }
  const best = (q, fields) => { let b = -1; fields.forEach(([s, w]) => { if (!s) return; const f = fuzzy(q, s); if (f >= 0) b = Math.max(b, f * w); }); return b; };

  // ---------- items ----------
  const THEMES = ['system', 'light', 'dark'], THEME_KO = { system: '시스템', light: '라이트', dark: '다크' };
  function navItems() {
    const out = [{ key: 'go:chat', t: '채팅', ic: 'i-chat', cap: 'Esc', run: () => R.openChannel('all') }, { key: 'go:ch:all', t: '전체 채널', ic: 'i-all', cap: '1', run: () => R.openChannel('all') }];
    M.channels.forEach((c, i) => out.push({ key: 'go:ch:' + c.id, t: c.name, ic: C.chIcon(c), cap: i < 8 ? String(i + 2) : '', run: () => R.openChannel(c.id) }));
    return out.concat([['board', '보드', 'i-board', 'b'], ['settings', '설정', 'i-gear', ',']].map(([id, t, ic, cap]) => ({ key: 'go:' + id, t, ic, cap, run: () => go(id) })));
  }
  const actItems = () => [
    { key: 'act:refresh', t: '새로고침', ic: 'i-down', cap: 'r', run: () => { R.refresh(); R.emit('resort'); } },
    { key: 'act:pause', t: R.isPaused() ? '재개' : '일시정지', ic: R.isPaused() ? 'i-play' : 'i-pause', cap: 'p', run: () => R.setPaused(!R.isPaused()) },
    { key: 'act:theme', t: '테마 전환', s: '현재 ' + THEME_KO[S.theme], ic: 'i-gear', run: () => { S.theme = THEMES[(THEMES.indexOf(S.theme) + 1) % 3]; R.applySettings(); } },
    { key: 'act:kids', t: '하위 에이전트 보기', s: R.U.showKids ? '현재 켜짐' : '현재 꺼짐', ic: 'i-chev', run: () => { R.U.showKids = !R.U.showKids; R.save(); R.emit('resort'); } },
    { key: 'act:addsrv', t: '서버 추가', ic: 'i-server', run: () => AddServer.open({}) },
    ...(Room.canFlow() ? [{ key: 'act:flow', t: Room.flowOn ? '대화 보기' : '흐름 보기', s: '지시가 퍼지는 모양', ic: 'i-chev', cap: 'f', run: () => Room.toggleFlow() }] : []),
  ];
  function agentItems(q) {
    const out = [];
    for (const a of M.agents.values()) {
      const md = C.meta(a), chn = R.chName(a.ch);
      const sc = best(q, [[a.name, 3], [a.tool, 2], [md.model, 1.5], [chn, 2], [a.why, 1], [a.now, 1]]);
      if (sc >= 0) out.push({ key: 'a:' + a.key, sc, a, t: a.name, s: [chn, a.tool].filter(Boolean).join(' · '), kind: a.parent ? '하위' : '방' });
    }
    return out.sort((x, y) => y.sc - x.sc).slice(0, 8);
  }
  function build(raw) {
    const q = raw.toLowerCase().replace(/\s+/g, '');
    let g = [['이동', navItems()], ['동작', actItems()]];
    if (q) {
      g = g.map(([n, it]) => [n, it.map(x => { const sc = best(q, [[x.t, 1], [x.cap, 0.5]]); return { ...x, sc: sc >= 0 && x.t.toLowerCase().replace(/\s+/g, '').startsWith(q) ? sc + 100 : sc }; }).filter(x => x.sc >= 0).sort((a, b) => b.sc - a.sc)]);
      g.push(['방', agentItems(q)]);
      g = g.filter(x => x[1].length).sort((a, b) => b[1][0].sc - a[1][0].sc);     // best-matching group first
    }
    const flat = [];
    for (const [n, it] of g) { flat.push({ key: 'h:' + n, head: n }); for (const x of it) flat.push(x); }
    return flat;
  }

  // ---------- rendering ----------
  function mkRow(it) {
    const kind = it.key.split(':')[0];
    if (kind === 'h') return h('div.pal-h', { role: 'presentation' });
    const r = h('div.pal-r', { class: kind, role: 'option', id: 'pal-o' + (++uid), on: { click: () => run(it.key), mousemove: () => setSel(it.key, false) } },
      kind === 'a' ? C.glyph(it.a.st) : svgUse(it.ic, 'ic'), h('span.m', h('span.t'), h('span.s')), h('span.e'));
    return r;
  }
  function setRow(el, it) {
    if (it.head) return text(el, it.head);
    text(el.querySelector('.t'), it.t); if (it.ic && !it.a) attr(el.querySelector('use'), 'href', '#' + it.ic); attr(el.querySelector('.t'), 'title', it.t);
    text(el.querySelector('.s'), it.s || '');
    const e = el.querySelector('.e');
    if (it.a) { C.setGlyph(el.firstElementChild, it.a.st); text(e, it.kind); }
    else if (it.cap && !e.firstChild) e.append(C.kbd(it.cap));
    else if (it.cap) text(e.firstChild, it.cap);
    else text(e, '');
  }
  function render(scroll) {
    rows = build(input.value);
    const opts = rows.filter(r => !r.head);
    if (!opts.length) rows = [{ key: 'none', none: true }];
    keyed(list, rows, {
      key: r => r.key,
      create: r => r.none ? h('div.pal-none', '일치하는 항목이 없습니다') : mkRow(r),
      update: (el, r) => { if (!r.none) setRow(el, r); },
    });
    if (!opts.some(r => r.key === sel)) sel = opts[0] ? opts[0].key : '';
    paint(scroll);
  }
  function paint(scroll) {
    let act = null;
    for (const el of list.children) { const on = el.dataset.key === sel; if (el.getAttribute('role') === 'option') attr(el, 'aria-selected', on ? 'true' : 'false'); if (on) act = el; }
    attr(input, 'aria-activedescendant', act && act.id);
    if (scroll && act) { act.scrollIntoView({ block: 'nearest' }); if (act.previousElementSibling && !act.previousElementSibling.previousElementSibling) list.scrollTop = 0; }
  }
  function setSel(k, scroll) { if (sel === k) return; sel = k; paint(scroll); }
  function move(d) {
    const opts = rows.filter(r => !r.head && !r.none); if (!opts.length) return;
    const i = opts.findIndex(r => r.key === sel);
    setSel(opts[(i + d + opts.length) % opts.length].key, true);
  }
  function run(k, shift) {
    const it = rows.find(r => r.key === k); if (!it) return;
    close();
    if (it.a) R.openRoom(it.a.ch, it.a.id); else it.run();
  }

  // ---------- open / close ----------
  function open(m, q) {
    if (scrim) close();
    prev = document.activeElement; mode = m;
    scrim = h('div.pal-scrim', { class: m === 'sheet' ? 'sheet' : '', on: { mousedown: e => { if (e.target === scrim) close(); } } });
    scrim.addEventListener('wheel', e => { if (e.target === scrim) e.preventDefault(); }, { passive: false });
    if (m === 'pal') {
      input = h('input', { type: 'text', role: 'combobox', 'aria-label': '검색 또는 명령', placeholder: '검색 또는 명령…', autocomplete: 'off', spellcheck: 'false', 'aria-expanded': 'true', 'aria-controls': 'pal-list', 'aria-autocomplete': 'list' });
      list = h('div.pal-list#pal-list', { role: 'listbox', 'aria-label': '결과' });
      input.addEventListener('input', () => { sel = ''; render(true); });
      input.addEventListener('keydown', onKey);
      scrim.append(h('div.pal', { role: 'dialog', 'aria-modal': 'true', 'aria-label': '검색 또는 명령', on: { mousedown: e => { if (e.target !== input) e.preventDefault(); } } },   // focus never leaves the input
        h('div.pal-in', svgUse('i-search'), input), list,
        h('div.pal-foot', h('span', C.kbd('Esc'), '닫기'), h('span', '열기', C.kbd('↵')))));
      layer.append(scrim); input.value = q || ''; render(true); input.focus({ preventScroll: true });
    } else {
      const dlg = h('div.pal', { role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'sheet-t' },
        h('div.sheet-h', h('span#sheet-t', '단축키'), h('button.ibtn', { type: 'button', 'aria-label': '닫기', on: { click: close } }, C.kbd('Esc'))),
        h('div.sheet-b', { tabindex: '-1' }, table().map(r => h('div.sheet-r', h('span', r.label), h('span.k', r.keys.map(k => C.kbd(k))))),
          h('div.sheet-g', '톡'), TALK_KEYS.map(([k, l]) => h('div.sheet-r', h('span', l), h('span.k', C.kbd(k)))),
          h('div.sheet-leg', '■ 터미널에서 입력한 것 · □ 에겐 톡에서 보낸 메시지')));
      scrim.append(dlg); layer.append(scrim); dlg.querySelector('.sheet-b').focus({ preventScroll: true });   // the scroller holds focus so arrows/PageDown scroll
    }
    addEventListener('keydown', trap, true);
  }
  function close() {
    if (!scrim) return;
    removeEventListener('keydown', trap, true);
    scrim.remove(); scrim = null; mode = null;
    if (prev && prev.isConnected) prev.focus({ preventScroll: true }); prev = null;
  }
  // while a dialog is open: keep Tab inside, and let nothing but Esc / ? / Ctrl+K reach the page's global keys
  function trap(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      if (mode === 'sheet') { const b = scrim.querySelector('button'); (document.activeElement === b ? scrim.querySelector('.sheet-b') : b).focus({ preventScroll: true }); }
      return;
    }
    if (e.key === 'Escape') return;
    if (mode === 'sheet' && (e.key === '?' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'))) { e.preventDefault(); e.stopPropagation(); close(); if (e.key !== '?') open('pal'); return; }
    if (mode === 'sheet') { e.stopPropagation(); if (e.key.startsWith('Arrow') || e.key === ' ') return; }
  }

    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); if (sel) run(sel, e.shiftKey); }
  }

  R.onEsc(() => { if (!scrim) return false; close(); return true; });   // registered after P2 → runs first
  R.on('model', () => { if (mode === 'pal') render(false); });
  R.on('palette', () => (mode === 'pal' ? close() : open('pal')));
  R.key('?', () => (mode === 'sheet' ? close() : open('sheet')), '단축키');
  // screenshot / test overrides, like ?theme=: ?pal=data opens the palette with a query, ?sheet=1 the shortcut sheet
  let qs = new URLSearchParams(location.search);
  if (!qs.has('pal') && !qs.has('sheet')) qs = null;
  if (qs) R.on('model', () => { if (qs) { const q = qs; qs = null; open(q.has('sheet') ? 'sheet' : 'pal', q.get('pal')); } });
})();

/* ---- 68-states.js ---- */
/* ===== 68-states.js — window.States: skeleton / banner / missing (CHAT-UX §6). The hub-down line lives in the list's summary row.
   All elements are cached (banner per channel, empty per kind, missing per session) and patched in place; text via textContent only. ===== */
window.States = (() => {
  const { h, svgUse, text, attr, cls, M, on, $ } = R;
  const nodes = (n, f) => Array.from({ length: n }, f);

  // ---------- skeleton (views call this until M.loaded; the header ring is the only spinner) ----------
  function skeleton(n = 5) {
    return h('div.sk-list', { 'aria-hidden': 'true', class: M.loaded ? 'done' : '' },
      nodes(n, () => h('div.sk-row', h('i.g'), h('i.b1'), h('i.e'), h('i.b2'))));
  }
  on('model', () => R.$$('.sk-list:not(.done)').forEach(el => el.classList.add('done')));   // never shimmer after load

  // ---------- badperm: the PC-side Windows permission fix (constant command, copy button, one more line) ----------
  function badperm() {
    const b = R.BADPERM, btn = h('button.btn.sm', { type: 'button', on: { click: e => C.copy(b.cmd, e.currentTarget, '명령 복사') } }, '명령 복사');
    return h('div.bperm', h('code.mono.bcmd', b.cmd), h('div.bact', btn), h('p.meta', b.extra));
  }

  // ---------- banner(ch): one element per channel; null when ok and no warnings ----------
  const banners = {};
  function mkBanner(ch) {
    const log = h('pre.inset', { hidden: true, id: 'bnlog-' + ch });
    const logBtn = h('button.btn.link', { type: 'button', 'aria-expanded': 'false', 'aria-controls': 'bnlog-' + ch, on: { click: () => { log.hidden = !log.hidden; attr(logBtn, 'aria-expanded', log.hidden ? 'false' : 'true'); } } }, '로그 보기');
    const retry = () => { R.refresh(); again2.disabled = true; text(again2, '확인하는 중…'); setTimeout(() => { again2.disabled = false; text(again2, '지금 확인'); }, 2500); };
    const again2 = h('button.btn.primary', { type: 'button', on: { click: retry } }, '지금 확인');
    const fixBtn = h('button.btn.primary', { type: 'button', hidden: true, on: { click: () => AddServer.open({ ch }) } }, '이 서버에 키 등록하기');
    const tunnel = h('span.hint'), sep1 = h('span.sep', '·'), bp = badperm();
    const err = h('div.bn-err', { role: 'alert', hidden: true },
      h('div.ttl', svgUse('g-dead', 'gl'), h('span.t')), h('div.sub'),
      h('div.acts', tunnel, bp, sep1, logBtn, fixBtn, again2), log);
    const longer = h('span.meta', { hidden: true }, '오래 걸리면 허브 창의 로그와 channels.json의 주소를 확인하세요');
    const conn = h('div.bn-conn', { role: 'status', hidden: true }, h('span', '서버에 연결하는 중입니다…'), longer, h('div.indet', { 'aria-hidden': 'true' }));
    const el = h('div.st-banner', { data: { ch } }, conn, err);
    el._p = { err, conn, log, tunnel, bp, sep1, longer, fixBtn, again2 };
    return el;
  }
  function banner(ch) {
    const c = R.chan(ch);
    if (!c) return null;
    if (c.state === 'ok' && !c.stale) { if (banners[ch]) banners[ch].remove(); return null; }
    const el = banners[ch] || (banners[ch] = mkBanner(ch)), p = el._p;
    p.conn.hidden = c.state !== 'connecting';
    el._since = c.state === 'connecting' ? el._since || Date.now() : 0;
    p.longer.hidden = !el._since || Date.now() - el._since < 30000;
    const bad = c.state === 'error' || (c.state === 'ok' && c.stale);
    p.err.hidden = !bad;
    if (bad) {
      const ssh = c.kind === 'ssh' && c.state === 'error';
      const bpm = ssh && R.sshKind(c.error) === 'badperm'; p.bp.hidden = !bpm;
      text(p.err.querySelector('.t'), bpm ? R.BADPERM.title : c.state === 'ok' ? '수집이 중단되었습니다' : ssh ? 'SSH 연결이 끊겼습니다' : '연결 오류');
      text(p.err.querySelector('.sub'), (c.t ? '마지막 수집 ' + R.fmtHM(c.t) : '아직 받은 데이터가 없습니다') + ' · 허브가 자동으로 다시 연결합니다 (최대 1분 간격)');
      const fx = R.sshFix(c); p.fixBtn.hidden = !fx; cls(p.again2, 'primary', !fx); cls(p.again2, 'link', fx);
      p.tunnel.hidden = !ssh; p.sep1.hidden = true;   // the hint is long: it wraps, a leading dot would dangle
      if (ssh) text(p.tunnel, R.sshHint(c.error) + ' (' + R.sshErr(c.error) + ')');
      text(p.log, c.error || '허브가 오류 내용을 보내지 않았습니다');
      if (!ssh && c.state === 'error' && p.log.hidden && !p.log.dataset.seen) { p.log.hidden = false; p.log.dataset.seen = '1'; attr(p.err.querySelector('[aria-controls]'), 'aria-expanded', 'true'); }   // non-ssh: the error text is the content, show it once
    }
    return el;
  }

  // ---------- missing(ch, id): session info unavailable; P3 places the dimmed last tree under it ----------
  const missings = {};
  function missing(ch, id) {
    const k = ch + '\n' + id;
    if (!missings[k]) {
      missings[k] = h('div.missing', { role: 'alert' },
        h('h3', svgUse('i-flag'), '세션 정보를 가져오지 못했습니다'),
        h('ul', h('li', '채널 연결이 끊겼을 수 있습니다 — 채널 연결 상태를 확인하세요'), h('li', '세션이 이미 종료되어 목록에서 사라졌을 수 있습니다'), h('li', '이 세션을 읽을 권한이 없을 수 있습니다')),

/* ===== 73-office.js — 재미 모드: 픽셀 오피스 (OVERVIEW-CONTRACT §3). A cross-section building: each server a storey, each project
   (project.key) a room, each agent a desk, subagents as interns beside their lead. Characters come from window.AT_SPRITES (72-sprites.js);
   without it the overview stays on the wiring map. Layers (back → front): far sky (pre-blurred), static building/rooms/furniture
   (pre-rendered; night darkness baked in), screens, characters (never lit or bloomed), desk fronts, state bubbles; soft light at
   half resolution + bloom from an emitter mask at 1/16. One canvas, integer-scaled, ≤30 fps, only while visible (Overview owns the loop).
   Reduced motion: key poses, no particles, no walkers. All text on screen is canvas pixels or DOM textContent. ===== */
const OvOffice = (() => {
  const { h, text } = R;
  let AP = null;
  const RM = () => !!(AP && AP.reduced());
  const TH = () => { const t = AP ? AP.theme() : 'claude'; return t === 'chatgpt' ? 'codex' : t; };
  const DK = () => !!(AP && AP.dark());
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const hsh = s => { let x = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; };
  const signWide = room => !room.p.other && /[^ -~]/.test(String(room.p.name || ''));
  const signWideTxt = room => { const t = String(room.p.name || '').trim(); return t.length > 12 ? t.slice(0, 11) + '…' : t; };
  const signNameW = room => signWide(room) ? signWideTxt(room).length * 7 : textW(signTxt(room.p.other ? 'etc' : room.p.name, 18));
  const signTxt = (s, n) => { s = String(s || '').replace(/[^\x20-\x7e]/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '.' : s; };
const hx = v => typeof v === 'number' ? v : parseInt(v.slice(1), 16);
const RGB = c => [c >> 16 & 255, c >> 8 & 255, c & 255];
const mixc = (a, b, t) => { const A = RGB(a), B = RGB(b); return (Math.round(A[0] + (B[0] - A[0]) * t) << 16) | (Math.round(A[1] + (B[1] - A[1]) * t) << 8) | Math.round(A[2] + (B[2] - A[2]) * t); };
const cssc = c => '#' + (c & 0xFFFFFF).toString(16).padStart(6, '0');

class Lay {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Int32Array(w * h).fill(-1); }
  set(x, y, c) { x = Math.round(x); y = Math.round(y); if (c == null || c < 0 || x < 0 || y < 0 || x >= this.w || y >= this.h) return; this.d[y * this.w + x] = c; }
  get(x, y) { return x < 0 || y < 0 || x >= this.w || y >= this.h ? -1 : this.d[y * this.w + x]; }
  spr(rows, pal, ox, oy, o = {}) {
    for (let y = 0; y < rows.length; y++) {
      const row = rows[y], Y = oy + y;
      if (o.clip != null && Y >= o.clip) continue;
      const sh = o.shear ? o.shear(y) : 0;
      for (let x = 0; x < row.length; x++) {
        const ch = row[o.flip ? row.length - 1 - x : x];
        if (ch === '.' || ch === ' ') continue;
        const c = pal[ch];
        if (c == null) continue;
        if (o.over && this.get(ox + x + sh, Y) === -1) continue;
        this.set(ox + x + sh, Y, c);
      }
    }
  }
  canvas(alpha = 1) {
    const cv = document.createElement('canvas'); cv.width = this.w; cv.height = this.h;
    const g = cv.getContext('2d'), im = g.createImageData(this.w, this.h), D = im.data;
    for (let i = 0; i < this.d.length; i++) { const c = this.d[i]; if (c < 0) continue; D[i * 4] = c >> 16 & 255; D[i * 4 + 1] = c >> 8 & 255; D[i * 4 + 2] = c & 255; D[i * 4 + 3] = Math.round(255 * alpha); }
    g.putImageData(im, 0, 0); return cv;
  }
}
/* selective outline: transparent pixels next to the sprite take a darker, hue-shifted version of their neighbour;
   lighter on the lit (top/left) side, darker on the shadow side. Rim light on right edges (coloured by theme). */
function finish(L, deep, rim, rimA = .38, key = 0xFFF2D8) {
  const w = L.w, hgt = L.h, src = L.d.slice(), out = L.d;
  for (let y = 0; y < hgt; y++) for (let x = 0; x < w; x++) {
    const c = src[y * w + x]; if (c < 0) continue;
    const r = x + 1 >= w ? -1 : src[y * w + x + 1], up = y > 0 ? src[(y - 1) * w + x] : -1, lf = x > 0 ? src[y * w + x - 1] : -1;
    if (r < 0 && rim != null) out[y * w + x] = mixc(c, rim, rimA);
    else if ((up < 0 || lf < 0) && key != null) out[y * w + x] = mixc(c, key, .14);
  }
  const s2 = out.slice();
  for (let y = 0; y < hgt; y++) for (let x = 0; x < w; x++) {
    if (src[y * w + x] >= 0) continue;
    const R = x + 1 < w ? src[y * w + x + 1] : -1, Lf = x > 0 ? src[y * w + x - 1] : -1, D = y + 1 < hgt ? src[(y + 1) * w + x] : -1, U = y > 0 ? src[(y - 1) * w + x] : -1;
    let n = -1, lit = false;
    if (R >= 0) { n = R; lit = true; } else if (D >= 0) { n = D; lit = true; } else if (Lf >= 0) n = Lf; else if (U >= 0) n = U;
    if (n < 0) continue;
    s2[y * w + x] = mixc(n, deep, lit ? .62 : .8);
  }
  L.d.set(s2);
  return L;
}

      s.drawImage(pl.cv[Math.floor(t / 90) % 2], Math.round(x) - 4, Math.round(y) - 2);
      return true;
    });
    // state cues (crisp, unlit)
    for (const s2 of this.order) {
      const n = s2.n, small = s2.kind === 'kid', o = small ? G.K : G.L, cx = small ? G.icx : G.cx;
      let kind = null, fr = 0;
      switch (n.st) { case 'user': kind = 'bang'; break; case 'stall': kind = 'dots'; fr = R ? 2 : Math.min(2, Math.floor(t / 600) % 4); break; case 'tool': kind = 'gear'; fr = R ? 0 : Math.floor(t / 420) % 2; break; case 'child': kind = 'tree'; break; case 'done': kind = 'check'; break; case 'stopped': kind = 'stop'; break; case 'dead': kind = 'plug'; break; }
      if (kind) {
        const img = this.bubble(kind, fr), bob = n.st === 'user' && !R ? Math.round(Math.sin(t / 220) * 1) : 0;
        let bx = kind === 'bang' ? s2.x + cx - (small ? 16 : 24) : s2.x + cx + (small ? 6 : 9), by = s2.y + o.oy - (small ? 4 : 5) + bob;
        if (kind === 'check') { bx = s2.x + o.mon[0] + (small ? -2 : 1); by = s2.y + o.mon[1] - 16; }
        s.drawImage(img, bx, by);
        if (kind === 'bang') { lights.push([bx + 7, by + 6, 0xFF4A3A, 14, R ? .35 : .4 + .12 * Math.sin(t / 220), 1]); cores.push([bx + 7, by + 6, 0xFF4A3A, 6, .7]); }
      }
      if (n.st === 'idle') for (let i = 0; i < 3; i++) {
        const p = R ? (i + .5) / 3 : ((t / 2600) + i / 3 + s2.ph) % 1;
        const zx = s2.x + cx + (small ? 4 : 6) + Math.round(p * 7 + Math.sin(p * 6) * 1.5), zy = s2.y + o.oy + (small ? 4 : 8) - Math.round(p * 13);
        if (p > .85) continue;
        const gl = ZGLYPH[p > .45 ? 1 : 0];
        for (let y = 0; y < gl.length; y++) for (let x = 0; x < gl[y].length; x++) if (gl[y][x] === '#') { PX(s, zx + x + 1, zy + y + 1, 0x2A2238); PX(s, zx + x, zy + y, 0xEAF2FF); }
      }
    }
    const [ax, ay] = this.antenna; if (R || Math.floor(t / 900) % 2) { PX(g, ax, ay, 0xFFFFFF); lights.push([ax, ay, 0xFFFFFF, 6, .5, 1]); cores.push([ax, ay, 0xFFFFFF, 3, .9]); }
    if (N) { const [sx, sy, sw] = this.signGlow, c = R ? 5000 : t % 9000, a = c < 120 || (c > 220 && c < 300) ? .12 : .5; lights.push([sx, sy, P.acc[3], sw * .8, a, .45]); cores.push([sx, sy, P.acc[3], sw * .35, a * 1.4]); }
    // light (half res) and emitter mask (quarter res) for bloom
    const lg = this.lg; lg.setTransform(1, 0, 0, 1, 0, 0); lg.globalCompositeOperation = 'source-over'; lg.clearRect(0, 0, this.lc.width, this.lc.height);
    lg.drawImage(this.lightStatic, 0, 0); lg.setTransform(.5, 0, 0, .5, 0, 0); lg.globalCompositeOperation = 'lighter';
    for (const [x, y, c, r, a, sy] of lights) glow(lg, x, y, r, c, N ? a : a * .5, sy);
    lg.setTransform(1, 0, 0, 1, 0, 0);
    const eg = this.eg; eg.setTransform(1, 0, 0, 1, 0, 0); eg.globalCompositeOperation = 'source-over'; eg.clearRect(0, 0, this.em.width, this.em.height);
    eg.drawImage(this.emStatic, 0, 0); eg.setTransform(.25, 0, 0, .25, 0, 0); eg.globalCompositeOperation = 'lighter';
    for (const [x, y, c, r, a] of cores) glow(eg, x, y, r, c, N ? a : a * .5);
    eg.setTransform(1, 0, 0, 1, 0, 0);
    this.bg.clearRect(0, 0, this.bc.width, this.bc.height); this.bg.drawImage(this.em, 0, 0, this.bc.width, this.bc.height);
    this.present();
  },
  present() {
    const cg = this.cg, W = this.WD * this.S, H = this.HD * this.S, N = this.P.night;
    cg.globalCompositeOperation = 'source-over'; cg.globalAlpha = 1; cg.imageSmoothingEnabled = false;
    cg.clearRect(0, 0, W, H);
    cg.drawImage(this.farBlur, 0, 0);
    if (this.farH < this.HD) { cg.imageSmoothingEnabled = true; cg.drawImage(this.far, 0, this.farH, this.WD, this.HD - this.farH, 0, this.farH * this.S, W, H - this.farH * this.S); cg.imageSmoothingEnabled = false; }
    cg.drawImage(this.fb, 0, 0, W, H);
    // light: 'screen' never clips pale materials to white; bloom comes only from the emitter mask
    cg.imageSmoothingEnabled = true; cg.globalCompositeOperation = 'screen';
    cg.globalAlpha = N ? 1 : .75; cg.drawImage(this.lc, 0, 0, W, H);
    cg.globalAlpha = N ? .9 : .4; cg.drawImage(this.bc, 0, 0, W, H);
    // sprites last: crisp, never lit or bloomed (night tint + rim are baked into the frames)
    cg.globalAlpha = 1; cg.globalCompositeOperation = 'source-over'; cg.imageSmoothingEnabled = false;
    cg.drawImage(this.fs, 0, 0, W, H);
  },
  /* ---------- DOM overlay: focusable desks (buttons), nameplates, storey labels ---------- */
  buildOverlays() {
    const box = this.hits; box.replaceChildren(); this.hit = new Map();
    const k = this.k, G = this.G;
    for (const st of this.stories) {
      const sv = st.sv;
      box.append(h('div.slab', { style: 'left:' + ((this.B.x0 + 3) * k) + 'px;top:' + ((st.y + this.B.SLAB / 2) * k - 10) + 'px', 'aria-hidden': 'true' },
        h('span', sv.name), h('small', (sv.kind === 'local' ? '내 PC' : 'SSH') + ' · ' + (sv.state === 'ok' ? '연결됨' : sv.state === 'connecting' ? '연결 중' : '끊김'))));
    }
    for (const room of this.rooms) if (room.htmlSign) {
      const hs = room.htmlSign;
      box.append(h('div.sgn', { style: 'left:' + ((room.x + hs.x) * k) + 'px;top:' + ((room.y + hs.y) * k) + 'px;font-size:' + (7 * k) + 'px;line-height:' + (7 * k) + 'px;color:' + hs.col, 'aria-hidden': 'true' }, hs.text));
    }
    for (const s2 of this.order) {
      const small = s2.kind === 'kid', n = s2.n, o = small ? G.K : G.L, w = small ? G.IW : G.SW, top = Math.min(o.oy, G.DT - 24) - 4, key = n.key;
      const b = h('button.hit' + (small ? '.kid' : ''), { type: 'button', data: { agent: key }, style: 'left:' + (s2.x * k) + 'px;top:' + ((s2.y + top) * k) + 'px;width:' + (w * k) + 'px;height:' + ((G.DT + 17 - top) * k) + 'px' },
        h('span.np', { style: 'top:' + ((G.DT + 7 - top) * k) + 'px' }, h('i'), h('span')));
      AP.bindAgent(b, () => { const z = this.stations.find(q => q.n.key === key); return z && z.n; });
      box.append(b); this.hit.set(key, b);
    }
    this.refreshOverlays();
  },
  refreshOverlays() {
    if (!this.hit) return;
    for (const s2 of this.stations) {
      const b = this.hit.get(s2.n.key); if (!b) continue;
      const n = s2.n;
      b.className = 'hit' + (s2.kind === 'kid' ? ' kid' : ''); R.stClass(b, n.st); b.dataset.st = n.st; b.dataset.w = n.waiting ? '1' : ''; b.setAttribute('aria-label', AP.label(n));
      const np = b.querySelector('.np'); np.firstChild.className = 'st-' + n.st; text(np.lastChild, n.name);
    }
  },
  plane(n) { if (!this.stations.find(z => z.n.key === n.key)) return; this.planes.push({ id: n.id, t0: performance.now() }); }
};

  /* ---------- module API for Overview ---------- */
  const sigOf = (D, w) => w + '#' + D.projects.map(p => p.id + ':' + D.roots.filter(r => r.project === p.id).map(r => r.key + '(' + r.kids.slice(0, 4).map(k => k.key).join(',') + ')').join(',')).join('|') + '#' + D.servers.map(s => s.id + s.state).join(',');
  function mount(host) {
    Office.host = host;
    Office.world = h('div.ovo'); Office.cv = h('canvas', { 'aria-hidden': 'true' }); Office.hits = h('div.hits', { role: 'group', 'aria-label': '책상' });
    Office.cg = Office.cv.getContext('2d');
    Office.world.append(Office.cv, Office.hits);
    host.replaceChildren(Office.world);
    Office.vig = h('div.ovo-vig', { 'aria-hidden': 'true' }); host.parentElement && host.parentElement.append(Office.vig);
    Office.sig = '';
  }
  return {
    available: () => Chars.load(),
    chars: () => (Chars.load() ? Chars : null),   // selftest hook (variant rotation)
    update(host, D, api, force) {
      AP = api; Office.D = D;
      if (!Chars.load()) return;
      if (Office.host !== host || !Office.world || !Office.world.isConnected) mount(host);
      const sg = sigOf(D, host.clientWidth);
      if (sg !== Office.sig || force || !Office.stat) { Office.sig = sg; Office.layout(); Office.render(performance.now()); return; }
      const byKey = new Map(), walk = n => { byKey.set(n.key, n); n.kids.forEach(walk); }; D.roots.forEach(walk);
      for (const s2 of Office.stations) { const n = byKey.get(s2.n.key); if (n) s2.n = n; }
      Office.refreshOverlays();
      if (RM()) Office.render(performance.now());
    },
    frame(t) { if (Office.stat && Office.world && Office.world.isConnected) Office.render(t); },
    plane(n) { if (!RM()) Office.plane(n); },
    invalidate() { Office.setTheme(); },
    unmount() { if (Office.vig) Office.vig.remove(); Office.world = null; Office.host = null; Office.stat = null; Office.sig = ''; }
  };
})();

/* ===== 90-tail.html (lead) — boot ===== */
R.boot();
</script>
