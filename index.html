.dlg .bn-err .inset { max-height: 160px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.dlg > div > .ttl { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.dlg .flash { margin: 10px 0 0; color: var(--ink); }
.dlg .steps ~ .meta { margin: 10px 0 0; }
.steps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 20px 96px minmax(0, 1fr); column-gap: 8px; align-items: start; }
.steps .gl { margin-top: 2px; }
.steps b { font-weight: 600; }
.steps .d { color: var(--ink-2); overflow-wrap: anywhere; }
.steps .d.mono { font-size: 12px; }
.steps li[data-st=pending] .gl { color: var(--ink-2); }
.steps li[data-st=pending] b { color: var(--ink-2); }
.steps li[data-st=active] .gl { color: var(--ink); }
.steps li[data-st=user] .gl { color: var(--signal); }
.steps li[data-st=error] .gl { color: var(--ink); }
.steps li[data-st=error] b { color: var(--ink); }
.dlg .bn-err + .steps { margin-top: 14px; }
/* entry points */
.shd { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cacts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.clist > .meta { padding: 12px 0; }
@media (max-width: 700px) {
  .dlg .frow, .dlg .frow.pair { grid-template-columns: minmax(0, 1fr); }
  .dlg .frow > label { line-height: 20px; }
  .dlg .frow.pair > label + .fc + label { padding-left: 0; margin-top: 6px; }
  .steps li { grid-template-columns: 20px minmax(0, 1fr); }
  .steps li .d { grid-column: 2; }
}
.pchips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
.pchips .meta { margin-right: 4px; }
.pchip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.dlg .bperm { margin-top: 6px; }
.dlg .field .eye { height: 24px; min-width: 24px; padding: 0 4px; flex: none; }
.dlg .sess { display: flex; gap: 8px; align-items: flex-start; margin: 4px 0 8px; font-size: 13px; }
.dlg .sess input { margin-top: 4px; }
.dlg .confirm { display: grid; gap: 6px; margin: 12px 0 0; padding: 10px 12px; border: 1.5px solid var(--signal); border-radius: var(--r-card); border-top-left-radius: 4px; background: var(--tint-signal); }
.dlg .confirm .ah { color: var(--signal-text); font-weight: 600; }
.dlg .confirm p { margin: 0; }
.dlg .confirm .fp { display: block; padding: 6px 10px; border-radius: var(--r-btn); background: var(--surface); font-size: 12.5px; word-break: break-all; user-select: all; }
code.nw, .nw { white-space: nowrap; }
.dlg .bn-err[data-kind=host_key_changed] .acts .btn:not(.primary):not(.link) { flex-basis: 100%; order: 2; }
.dlg .bn-err[data-kind=host_key_changed] .acts .btn.primary { order: 1; }
.pchip[aria-pressed=true] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.dlg [tabindex="-1"]:focus, .dlg [tabindex="-1"]:focus-visible { outline: none; }
/* key_rejected: what the diagnosis found, and the exact commands a fix runs */
.dlg .finds { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 6px; }
.dlg .finds li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; overflow-wrap: anywhere; }
.dlg .finds .lv { padding: 0 6px; border: 1px solid var(--line); border-radius: var(--r-btn); font-size: 11.5px; line-height: 18px; white-space: nowrap; color: var(--ink-2); }
.dlg .finds li[data-lv=fix] .lv { border-color: var(--signal); color: var(--signal-text); }
.dlg .finds li[data-lv=admin] .lv { border-color: var(--ink); color: var(--ink); }
.dlg .fixcmd { display: block; margin: 0; padding: 6px 10px; border-radius: var(--r-btn); background: var(--surface); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; }
.dlg .bn-err .finds { margin: 8px 0 2px; }

/* ---- 39-talk.css ---- */
/* ===== 39-talk.css — talk cards, name line, composer, confirm card, delivery states, 흐름 tree (TALK-UX). Tokens only; no hex. ===== */
/* talk card: the spawn-card family (radius 12, speaker-side top corner 4) */
.msg.ag .col:has(.talk), .msg.ag .col:has(.who:not([hidden])), .msg .col:has(.spe:not([hidden])) { width: min(72%, 640px); }
.bub.talk { display: block; padding: 10px 12px; border-radius: var(--r-card); border-top-left-radius: 4px; white-space: normal; }
.bub.talk .th { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12.5px; line-height: 18px; font-weight: 600; color: var(--ink-2); }
.bub.talk .th svg { width: 12px; height: 12px; fill: currentColor; flex: none; }
.bub.talk .thl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bub.talk .thr { font-weight: 500; flex: none; }
.tb { margin-top: 2px; font-size: 14px; line-height: 21px; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.tb.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--n, 3); overflow: hidden; }
.tb.open { max-height: 60vh; overflow: auto; }
.tb.enc { color: var(--ink-2); }
.bub.spawn .tb { margin-top: 0; }
.spe, .fvw { display: flex; align-items: flex-start; gap: 6px; min-width: 0; }
.spe .tb, .fvw .tb { flex: 1; min-width: 0; }
.spe .flk, .fvw .flk { flex: none; margin-top: 5px; color: var(--ink-2); }
.flk svg { width: 12px; height: 12px; fill: currentColor; display: block; }
.tf { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; font-size: 12.5px; line-height: 18px; color: var(--ink-2); }
.tf .tfr { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
.tf .btn.link { color: var(--ink-2); font-size: 12.5px; line-height: 18px; }
.tf .btn.link:hover { color: var(--ink); }
/* my talk: outlined = sent from here (peer authority); the filled bubble stays the terminal prompt */
.bub.talkme { border: 1.5px solid var(--accent); background: var(--surface); border-radius: var(--r-bubble); border-top-right-radius: 4px; }
.bub.talkme .th { color: var(--ink-2); }
/* delivery state */
.ds { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--ink-2); }
.ds .gl { width: 12px; height: 12px; color: inherit; vertical-align: 0; }
.ds.held { color: var(--signal-text); font-weight: 600; }
.ds.bad, .ds.exp { color: var(--ink); font-weight: 600; }
/* name line (group chat): the speaker's avatar sits in the normal .av slot */
.who { display: flex; align-items: center; gap: 6px; margin: 0 0 3px 2px; font-size: 12.5px; line-height: 18px; min-width: 0; }
.who .wn { max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; }
.who .wn:hover:not(:disabled) { text-decoration: underline; }
.who .wn:disabled { cursor: default; }
.av.gen .avs { display: none; }
/* the fan-out line and other system lines that carry a link */
.sysl .btn.link { display: inline; font-size: inherit; line-height: inherit; color: var(--ink); text-decoration: underline; }

/* footer = status row + composer row, one block with one hairline */
#foot { flex: none; background: var(--surface); border-top: 1px solid var(--line); }
#foot #sbar { border-top: 0; }
.stalk { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--signal-text); font-weight: 600; }
.stalk.calm { color: var(--ink-2); font-weight: 500; }
.trow { padding: 0 16px 12px; }
.cmp { display: flex; align-items: flex-end; gap: 8px; }
.cmw { flex: 1; min-width: 0; }
.cta { display: block; width: 100%; height: 40px; max-height: 124px; resize: none; border: 0; border-radius: var(--r-btn); background: var(--canvas); color: var(--ink); padding: 9px 12px; font: inherit; line-height: 21px; overflow-y: auto; }
.cta::placeholder { color: var(--ink-2); }
.cta:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.csend { flex: none; min-width: 72px; }
.ccnt { margin-top: 2px; text-align: right; font-size: 12.5px; line-height: 18px; color: var(--ink-2); }
.ccnt.over { color: var(--ink); font-weight: 600; }
.coff { display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 12.5px; line-height: 18px; color: var(--ink-2); }
.coff .gl { margin: 0; flex: none; }
.coff .cop { margin-left: auto; flex: none; }
/* confirm card: in place, not a modal; ink border (not red: nothing needs me yet) */
.confirm { display: grid; gap: 8px; padding: 12px 14px; border: 1.5px solid var(--ink); border-radius: var(--r-card); background: var(--surface); }
.cfh, .cft { font-size: 12.5px; line-height: 18px; font-weight: 600; }
.cfh { color: var(--ink-2); }
.cft { overflow-wrap: anywhere; }
.cfp { max-height: calc(6 * 21px + 20px); overflow: auto; padding: 10px 12px; border-radius: var(--r-btn); background: var(--canvas); white-space: pre-wrap; overflow-wrap: anywhere; }
.cfls { display: grid; gap: 4px; }
.cfls:empty { display: none; }
.cfl { display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; line-height: 18px; font-weight: 600; }
.cfl .gl { width: 12px; height: 12px; margin-top: 3px; }
.cfn { font-size: 12.5px; line-height: 18px; color: var(--ink-2); }
.cfb { display: flex; justify-content: flex-end; gap: 8px; }

/* 대화 | 흐름 toggle in the room header */
.hlinks .fseg { padding: 2px; }
.hlinks .fseg button { height: 24px; padding: 0 10px; font-size: 12.5px; }

/* 흐름: the drawer tree widened, with the text of each node */
#flow { position: absolute; inset: 0; z-index: 2; overflow-y: auto; padding-bottom: 24px; background: var(--canvas); outline: none; }
.fhead { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; margin: 16px 24px 0; }
.fhl { flex: 1; min-width: 220px; }
.fsum { font-weight: 600; color: var(--ink); }
.fhr { display: flex; align-items: center; gap: 12px; }
.fsw { display: inline-flex; align-items: center; gap: 8px; }
.fnote { margin: 8px 24px 0; }
#flow .ftree { margin: 12px 24px 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
.tn.fn { height: auto; overflow: visible; align-items: stretch; padding: 0 16px 0 12px; }
.tn.fn .tg { align-self: start; margin-top: 14px; }
.fn .tbody { align-self: stretch; padding: 8px 0; }
.fn + .fn .tbody { border-top: 1px solid var(--line); }
.fn.cur { background: var(--canvas); }
.ftree .tn .c { width: 20px; }
.ftree .tn .c.v::before, .ftree .tn .c.e.t::after { left: 9px; }
.ftree .tn .c.e::before { left: 9px; width: 11px; }
.ftree .tn .c.e:first-child:last-child::before { display: block; }   /* the root row is row 0: its children get an elbow too */
.tn.fn .t1 { height: 28px; gap: 8px; }
.tn.fn .dt-nm { font-size: 15px; line-height: 22px; }
.fn .av { width: 28px; height: 28px; border-radius: 9px; }
.fn .av .amk { width: 16px; height: 16px; }
.fn .av .avs { width: 14px; height: 14px; right: -4px; bottom: -4px; }
.fn .av .avs .gl { width: 11px; height: 11px; }
.fn .fst { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; flex: none; font-size: 12.5px; color: var(--ink-2); }
.fn .fst .gl { width: 12px; height: 12px; }
.fn .fst .el { margin-left: 0; }
.fn .ft { display: grid; gap: 2px; margin-top: 4px; padding-left: 36px; }
.fn .ft:empty { display: none; }
.fl { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; column-gap: 6px; align-items: start; }
.fk { font-size: 12.5px; line-height: 21px; font-weight: 600; color: var(--ink-2); white-space: nowrap; text-align: left; }
button.fk { border: 0; background: none; padding: 0; cursor: pointer; }
.fl .tb { margin-top: 0; }
.fl .tb.open { max-height: 280px; }
.fr .btn.link { font-size: 12.5px; line-height: 21px; color: var(--ink-2); }
.tn.fn.ghost { opacity: .55; cursor: default; }
.tn.fn.sumrow .av, .tn.fn.sumrow .fst, .tn.fn.sumrow .cnt, .tn.fn.sumrow .xp, .tn.fn.sumrow .bdg { display: none; }
.tn.fn.sumrow .dt-nm { font-weight: 500; color: var(--ink-2); font-size: 13px; }
.tn.fn.sumrow .t1 { height: 24px; }
.tn.fn .fexp { margin-left: auto; flex: none; }
@media (max-width: 900px) {
  .fn .fsl, .fn .xpt { display: none; }
  .ftree .tn .c { width: 16px; }
  .ftree .tn .c.v::before, .ftree .tn .c.e.t::after { left: 7px; }
  .ftree .tn .c.e::before { left: 7px; width: 9px; }
  .fhead { margin: 12px 16px 0; } .fnote { margin: 8px 16px 0; } #flow .ftree { margin: 12px 16px 0; }
}
/* ? sheet: the 톡 block */
.sheet-g { padding: 16px 0 4px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.sheet-leg { padding: 12px 0 0; font-size: 12.5px; color: var(--ink-2); }
</style>
</head>

/* ===== 50-core.js (lead) — escape/DOM helpers, keyed renderer, settings, data layer, router, keys.

const R = (() => {

  // ---------- DOM ----------
  // h('div.cls#id', {class, title, data: {...}, on: {click}, aria: {...}, attr...}, ...kids). Strings become text nodes.
  function h(spec, attrs, ...kids) {

  function text(el, s) { s = s == null ? '' : String(s); if (el.textContent !== s) el.textContent = s; return el; }
  function attr(el, k, v) { if (v == null || v === false) { if (el.hasAttribute(k)) el.removeAttribute(k); } else { v = v === true ? '' : String(v); if (el.getAttribute(k) !== v) el.setAttribute(k, v); } return el; }

  function stClass(el, st) { for (const c of [...el.classList]) if (c.startsWith('st-') && c !== 'st-' + st) el.classList.remove(c); el.classList.add('st-' + st); }

  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  // Keyed in-place list renderer. items: array; key(item) -> string; create(item) -> element; update(el, item, i).
  // Reuses elements by data-key, writes only through update(), moves nodes only when order changed,
  // never removes an element that holds focus (marks it .gone instead; removed on the next pass when unfocused).

    if (!/^[A-Za-z]:[\\/]+Users[\\/]+[^\\/]+[\\/]+\.ssh[\\/]+config$/i.test(p)) return false;

  }

  const HINT = {
    hostkey: '처음 연결하는 서버입니다 — 키 등록하기 버튼으로 호스트 키를 확인하고 접속을 등록하세요.',
    perm: '키 로그인이 되지 않습니다 — 키 등록하기 버튼으로 비밀번호를 한 번만 입력해 등록하세요.',
    hostchanged: '서버의 신원이 바뀌었습니다 — 서버 관리자에게 확인하기 전에는 접속하지 마세요. 확인 후 키 등록하기로 다시 등록합니다.',
    net: '서버에 닿지 않습니다. 주소·포트·네트워크(VPN)를 확인하세요.',
    nopy: '서버에 python3 가 없습니다. channels.json 의 python 값을 확인하세요.',
    nossh: 'ssh 프로그램을 찾지 못했습니다. Windows 설정에서 OpenSSH 클라이언트를 설치하세요.',
    badperm: 'Windows가 이 PC의 ssh 설정 파일 권한을 거부했습니다 — 서버 문제가 아니라 이 PC의 권한 문제입니다. 아래 명령을 PowerShell에 붙여 넣으세요.',
  };
  // kind badperm (ADD-SERVER-ENG §10): generic fix, no user names; the command is a constant
  const BADPERM = { title: '이 PC의 SSH 설정 파일 권한 문제입니다', cmd: '$f = "$env:USERPROFILE\\.ssh\\config"; $me = whoami; icacls $f /setowner $me; icacls $f /inheritance:r /grant:r "${me}:F"', extra: '그래도 같으면 ssh -V 가 8.x 인지 확인하고 OpenSSH 를 새 버전으로 올리세요' };
  const sshHint = e => { const k = sshKind(e); return k === 'badpermx' ? 'Windows가 이 PC의 ssh 설정 파일 ' + badpermPath(e) + ' 의 권한을 거부했습니다 — 내 사용자 폴더의 .ssh\\config 가 아니므로 관리자 권한 PowerShell에서 이 파일의 소유자·권한을 고쳐야 합니다 (자동 명령 없음).' : HINT[k] || '허브 창의 로그를 확인하세요.'; };
  const sshFix = c => c.kind === 'ssh' && c.state === 'error' && ['perm', 'hostkey', 'hostchanged'].includes(sshKind(c.error));   // these three get the 키 등록하기 button
  const sshErr = e => (String(e || '').split('\n').map(x => x.trim()).filter(Boolean).pop() || '').slice(0, 200);
  const fmtAgo = sec => sec < 10 ? '방금' : fmtDur(sec) + ' 전';
  const fmtAbs = ms => { const d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
  const fmtHM = ms => { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };

  }
  function setTime(el, t0, mode) { if (t0 == null) { delete el.dataset.t0; text(el, ''); attr(el, 'title', null); return; } el.dataset.t0 = Math.round(t0); if (mode) el.dataset.tf = mode; tickOne(el, Date.now()); }

  if (!['s', 'm', 'l'].includes(S.ofcSize)) S.ofcSize = 'm';   // 픽셀 오피스 크기: 작게 / 보통 / 크게 (Office.layout)
  delete S.showKids;   // moved to U.showKids (CHAT-UX §3)
  // per-user UI state (room.ui) — CHAT-UX §3: chip filter, sort, open room, drawer, last-viewed marks, 하위 rows, 조용함 expand
  const U = Object.assign({ expanded: {}, chFilter: 'all', sort: 'recent', room: null, drawer: false, seen: {}, showKids: false, quietOpen: false, flowText: false }, store.get('room.ui', {}));

/* ---- 64-import.js ---- */
/* ===== 64-import.js — 서버 목록 가져오기 (APP-UX §2): a .json file the company shares -> POST api/presets/import. Result copy is exact per APP-UX §2.

      const list = Array.isArray(parsed) ? parsed : parsed && typeof parsed === 'object' && Array.isArray(parsed.presets) ? parsed.presets : null;
      if (!list || !list.length) return show('서버 목록 파일이 아닙니다 — 회사에서 받은 .json 파일을 고르세요', true);
      const before = R.M.presets.length; let r; try { r = await R.apiPost('api/presets/import', raw); } catch { r = { status: 0 }; }

      if (inv > 0) return show('서버 ' + a + '개를 가져왔습니다 · ' + inv + '개는 형식이 맞지 않아 건너뜀 (host·port 확인)', false);

/* ---- 65-notify.js ---- */
/* ===== 65-notify.js — toasts + Windows notifications (CHAT-UX §7). Triggers and one-per-transition rules unchanged from DIRECTION §10.

  const toastSentence = e => e.type === 'talk' ? (e.kind === 'held' ? '보낸 톡이 터미널에서 승인을 기다립니다 (5분)' : e.kind === 'unreach' ? '보낸 톡이 연결 안 됨으로 닿지 못했습니다' : '보낸 톡이 거절되었습니다') : e.type === 'chan' ? '연결이 끊겼습니다 — 이 채널의 에이전트 상태를 확인할 수 없습니다' : e.type === 'proc-done' ? '오래 걸린 작업이 끝났습니다 (' + R.fmtDur(e.dur) + (e.cmd ? ', ' + R.str(e.cmd, 40) : '') + ')'
    : { user: '입력을 기다립니다', stall: '응답이 없습니다', stopped: '중단되었습니다', dead: '연결이 끊겼습니다' }[e.to];
  const title = e => e.type === 'chan' ? R.chName(e.ch) : e.type === 'talk' && e.kind === 'held' ? '터미널 승인 필요 — ' + ((e.agent && e.agent.name) || '?') : (e.agent && e.agent.name) || '?';

/* ---- 68-states.js ---- */
/* ===== 68-states.js — window.States: skeleton / banner / missing (CHAT-UX §6). The hub-down line lives in the list's summary row.
   All elements are cached (banner per channel, empty per kind, missing per session) and patched in place; text via textContent only. ===== */
window.States = (() => {
  const { h, svgUse, text, attr, cls, M, on, $ } = R;
  const nodes = (n, f) => Array.from({ length: n }, f);

  // ---------- skeleton (views call this until M.loaded; the header ring is the only spinner) ----------
  function skeleton(n = 5) {
    return h('div.sk-list', { 'aria-hidden': 'true', class: M.loaded ? 'done' : '' },
      nodes(n, () => h('div.sk-row', h('i.g'), h('i.b1'), h('i.e'), h('i.b2'))));
  }
  on('model', () => R.$$('.sk-list:not(.done)').forEach(el => el.classList.add('done')));   // never shimmer after load

  // ---------- badperm: the PC-side Windows permission fix (constant command, copy button, one more line) ----------
  function badperm() {
    const b = R.BADPERM, btn = h('button.btn.sm', { type: 'button', on: { click: e => C.copy(b.cmd, e.currentTarget, '명령 복사') } }, '명령 복사');
    return h('div.bperm', h('code.mono.bcmd', b.cmd), h('div.bact', btn), h('p.meta', b.extra));
  }

  // ---------- banner(ch): one element per channel; null when ok and no warnings ----------
  const banners = {};
  function mkBanner(ch) {
    const log = h('pre.inset', { hidden: true, id: 'bnlog-' + ch });
    const logBtn = h('button.btn.link', { type: 'button', 'aria-expanded': 'false', 'aria-controls': 'bnlog-' + ch, on: { click: () => { log.hidden = !log.hidden; attr(logBtn, 'aria-expanded', log.hidden ? 'false' : 'true'); } } }, '로그 보기');
    const retry = () => { R.refresh(); again2.disabled = true; text(again2, '확인하는 중…'); setTimeout(() => { again2.disabled = false; text(again2, '지금 확인'); }, 2500); };
    const again2 = h('button.btn.primary', { type: 'button', on: { click: retry } }, '지금 확인');
    const fixBtn = h('button.btn.primary', { type: 'button', hidden: true, on: { click: () => AddServer.open({ ch }) } }, '이 서버에 키 등록하기');
    const rekeyBtn = h('button.btn', { type: 'button', hidden: true, title: '키를 다시 등록해 다음부터 비밀번호 없이 연결합니다 (거절되면 원인을 찾아 고칩니다)', on: { click: () => AddServer.open({ ch, rekey: true }) } }, '키 로그인 설정');
    // the hint is one or two short sentences; the raw ssh line sits behind 자세히 (the full text is under 로그 보기)
    const raw = h('code.mono.raw', { hidden: true, id: 'bnraw-' + ch });
    const more = h('button.btn.link.more', { type: 'button', 'aria-expanded': 'false', 'aria-controls': 'bnraw-' + ch, on: { click: () => { raw.hidden = !raw.hidden; attr(more, 'aria-expanded', raw.hidden ? 'false' : 'true'); text(more, raw.hidden ? '자세히' : '접기'); } } }, '자세히');
    const tunnel = h('div.hint', h('span.ht'), ' ', more, raw), sep1 = h('span.sep', '·'), bp = badperm();
    const err = h('div.bn-err', { role: 'alert', hidden: true },
      h('div.ttl', svgUse('g-dead', 'gl'), h('span.t')), h('div.sub'), tunnel,
      h('div.acts', bp, sep1, fixBtn, rekeyBtn, logBtn, again2), log);
    const longer = h('span.meta', { hidden: true }, '오래 걸리면 허브 창의 로그와 channels.json의 주소를 확인하세요');
    const conn = h('div.bn-conn', { role: 'status', hidden: true }, h('span', '서버에 연결하는 중입니다…'), longer, h('div.indet', { 'aria-hidden': 'true' }));
    const el = h('div.st-banner', { data: { ch } }, conn, err);

    return el;
  }
  function banner(ch) {
    const c = R.chan(ch);
    if (!c) return null;
    if (c.state === 'ok' && !c.stale) { if (banners[ch]) banners[ch].remove(); return null; }
    const el = banners[ch] || (banners[ch] = mkBanner(ch)), p = el._p;
    p.conn.hidden = c.state !== 'connecting';
    el._since = c.state === 'connecting' ? el._since || Date.now() : 0;
    p.longer.hidden = !el._since || Date.now() - el._since < 30000;

      const bpm = ssh && R.sshKind(c.error) === 'badperm'; p.bp.hidden = !bpm;
      text(p.err.querySelector('.t'), bpm ? R.BADPERM.title : c.state === 'ok' ? '수집이 중단되었습니다' : ssh ? 'SSH 연결이 끊겼습니다' : '연결 오류');
      const pws = ssh && c.auth === 'password-session';   // the server refused our key: this run connects with a password
      const waitPw = pws && !c.session_pw;                 // ...and the hub has none yet: it will not retry on its own
      text(p.err.querySelector('.sub'), (c.t ? '마지막 수집 ' + R.fmtHM(c.t) : '아직 받은 데이터가 없습니다') + (waitPw ? '' : ' · 허브가 자동으로 다시 연결합니다 (최대 1분 간격)'));
      const fx = R.sshFix(c); p.fixBtn.hidden = !fx; p.rekeyBtn.hidden = !pws; cls(p.again2, 'primary', !fx); cls(p.again2, 'link', fx);
      text(p.fixBtn, pws ? '비밀번호로 연결' : '이 서버에 키 등록하기');
      p.tunnel.hidden = !ssh; p.sep1.hidden = true;
      if (ssh) {
        text(p.tunnel.querySelector('.ht'), pws ? '이 서버는 키 로그인이 안 돼서, 이번 실행에서는 비밀번호가 필요합니다.' : R.sshHint(c.error));
        const line = R.sshErr(c.error); text(p.raw, line); p.more.hidden = !line; if (!line) p.raw.hidden = true;
      }
      text(p.log, c.error || '허브가 오류 내용을 보내지 않았습니다');
      if (!ssh && c.state === 'error' && p.log.hidden && !p.log.dataset.seen) { p.log.hidden = false; p.log.dataset.seen = '1'; attr(p.logBtn, 'aria-expanded', 'true'); }   // non-ssh: the error text is the content, show it once
    }
    return el;
  }

  // ---------- missing(ch, id): session info unavailable; P3 places the dimmed last tree under it ----------
  const missings = {};
  function missing(ch, id) {
    const k = ch + '\n' + id;
    if (!missings[k]) {
      missings[k] = h('div.missing', { role: 'alert' },
        h('h3', svgUse('i-flag'), '세션 정보를 가져오지 못했습니다'),
        h('ul', h('li', '채널 연결이 끊겼을 수 있습니다 — 채널 연결 상태를 확인하세요'), h('li', '세션이 이미 종료되어 목록에서 사라졌을 수 있습니다'), h('li', '이 세션을 읽을 권한이 없을 수 있습니다')),
        h('div.acts', h('button.btn.primary', { type: 'button', on: { click: () => R.refresh() } }, '다시 시도')));
    }
    return missings[k];
  }

  return { skeleton, banner, missing, badperm };
})();

/* ===== 73-office.js — 재미 모드: 픽셀 오피스 (OVERVIEW-CONTRACT §3). A cross-section building: each server a storey, each project
   (project.key) a room, each agent a desk, subagents as interns beside their lead. Characters come from window.AT_SPRITES (72-sprites.js);
   without it the overview stays on the wiring map. Layers (back → front): far sky (pre-blurred), static building/rooms/furniture
   (pre-rendered; night darkness baked in), screens, characters (never lit or bloomed), desk fronts, state bubbles; soft light at
   half resolution + bloom from an emitter mask at 1/16. One canvas, integer-scaled, ≤30 fps, only while visible (Overview owns the loop).
   Reduced motion: key poses, no particles, no walkers. All text on screen is canvas pixels or DOM textContent. ===== */
const OvOffice = (() => {
  const { h, text } = R;
  let AP = null;
  const RM = () => !!(AP && AP.reduced());
  // state cue above a desk: the red '!' only for an unread wait; a wait I already opened (n.ack) gets a calm grey '…'
  const cueOf = n => ({ user: n.ack ? 'read' : 'bang', stall: n.ack ? 'read' : 'dots', tool: 'gear', child: 'tree', done: 'check', stopped: 'stop', dead: 'plug' })[n.st] || null;
  const TH = () => { const t = AP ? AP.theme() : 'claude'; return t === 'chatgpt' ? 'codex' : t; };
  const DK = () => !!(AP && AP.dark());
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const hsh = s => { let x = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; };
  const signWide = room => !room.p.other && /[^ -~]/.test(String(room.p.name || ''));
  const signWideTxt = room => { const t = String(room.p.name || '').trim(); return t.length > 12 ? t.slice(0, 11) + '…' : t; };
  const signNameW = room => signWide(room) ? signWideTxt(room).length * 7 : textW(signTxt(room.p.other ? 'etc' : room.p.name, 18));
  const signTxt = (s, n) => { s = String(s || '').replace(/[^\x20-\x7e]/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '.' : s; };
const hx = v => typeof v === 'number' ? v : parseInt(v.slice(1), 16);
const RGB = c => [c >> 16 & 255, c >> 8 & 255, c & 255];
const mixc = (a, b, t) => { const A = RGB(a), B = RGB(b); return (Math.round(A[0] + (B[0] - A[0]) * t) << 16) | (Math.round(A[1] + (B[1] - A[1]) * t) << 8) | Math.round(A[2] + (B[2] - A[2]) * t); };
const cssc = c => '#' + (c & 0xFFFFFF).toString(16).padStart(6, '0');
const lum = c => { const [r, g, b] = RGB(c); return (r * 2 + g * 3 + b) / 6 / 255; };

class Lay {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Int32Array(w * h).fill(-1); }
  set(x, y, c) { x = Math.round(x); y = Math.round(y); if (c == null || c < 0 || x < 0 || y < 0 || x >= this.w || y >= this.h) return; this.d[y * this.w + x] = c; }
  get(x, y) { return x < 0 || y < 0 || x >= this.w || y >= this.h ? -1 : this.d[y * this.w + x]; }
  spr(rows, pal, ox, oy, o = {}) {
    for (let y = 0; y < rows.length; y++) {
      const row = rows[y], Y = oy + y;
      if (o.clip != null && Y >= o.clip) continue;
      const sh = o.shear ? o.shear(y) : 0;
      for (let x = 0; x < row.length; x++) {
        const ch = row[o.flip ? row.length - 1 - x : x];
        if (ch === '.' || ch === ' ') continue;
        const c = pal[ch];
        if (c == null) continue;
        if (o.over && this.get(ox + x + sh, Y) === -1) continue;
        this.set(ox + x + sh, Y, c);
      }
    }
  }
  canvas(alpha = 1) {
    const cv = document.createElement('canvas'); cv.width = this.w; cv.height = this.h;
    const g = cv.getContext('2d'), im = g.createImageData(this.w, this.h), D = im.data;
    for (let i = 0; i < this.d.length; i++) { const c = this.d[i]; if (c < 0) continue; D[i * 4] = c >> 16 & 255; D[i * 4 + 1] = c >> 8 & 255; D[i * 4 + 2] = c & 255; D[i * 4 + 3] = Math.round(255 * alpha); }
    g.putImageData(im, 0, 0); return cv;
  }
}
/* selective outline: transparent pixels next to the sprite take a darker, hue-shifted version of their neighbour;
   lighter on the lit (top/left) side, darker on the shadow side. Rim light on right edges (coloured by theme). */
function finish(L, deep, rim, rimA = .38, key = 0xFFF2D8) {
  const w = L.w, hgt = L.h, src = L.d.slice(), out = L.d;
  for (let y = 0; y < hgt; y++) for (let x = 0; x < w; x++) {
    const c = src[y * w + x]; if (c < 0) continue;
    const r = x + 1 >= w ? -1 : src[y * w + x + 1], up = y > 0 ? src[(y - 1) * w + x] : -1, lf = x > 0 ? src[y * w + x - 1] : -1;
    if (r < 0 && rim != null) out[y * w + x] = mixc(c, rim, rimA);
    else if ((up < 0 || lf < 0) && key != null) out[y * w + x] = mixc(c, key, .14);
  }
  const s2 = out.slice();
  for (let y = 0; y < hgt; y++) for (let x = 0; x < w; x++) {
    if (src[y * w + x] >= 0) continue;
    const R = x + 1 < w ? src[y * w + x + 1] : -1, Lf = x > 0 ? src[y * w + x - 1] : -1, D = y + 1 < hgt ? src[(y + 1) * w + x] : -1, U = y > 0 ? src[(y - 1) * w + x] : -1;
    let n = -1, lit = false;
    if (R >= 0) { n = R; lit = true; } else if (D >= 0) { n = D; lit = true; } else if (Lf >= 0) n = Lf; else if (U >= 0) n = U;
    if (n < 0) continue;
    s2[y * w + x] = mixc(n, deep, lit ? .62 : .8);
  }
  L.d.set(s2);
  return L;
}
